<!-- CONCEPT: Generative Poster — a seeded composition of gradients, arcs and shapes with typography, reseedable on click -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generative Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0d}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;cursor:pointer}
  #badge{position:fixed;left:16px;bottom:14px;z-index:10;font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:.14em;color:rgba(240,240,255,.55);text-transform:uppercase;
    display:flex;gap:10px;align-items:center}
  #badge a{color:rgba(240,240,255,.55);text-decoration:none;border-bottom:1px solid rgba(240,240,255,.22)}
  #badge a:hover{color:#fff}
  #badge .dot{width:4px;height:4px;border-radius:50%;background:#ff8fb1;box-shadow:0 0 8px #ff8fb1}
  #hint{position:fixed;right:20px;bottom:14px;font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.16em;color:rgba(240,240,255,.4);text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="badge"><span class="dot"></span><span>Generative Poster</span><span>&middot;</span><a href="index.html">&larr; Gallery</a></div>
<div id="hint">click to reseed</div>
<script>
(()=>{
  const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
  let W,H,DPR;
  let seed=Math.floor(Math.random()*1e6);
  const PALETTES=[
    ['#ff8fb1','#ffd166','#6ad0ff','#a78bfa','#0a0a0d'],
    ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#0a0a0d'],
    ['#ffa41b','#ff5151','#f6f7d7','#5f27cd','#0a0a0d'],
    ['#00e0c6','#7bffb0','#ffd23f','#ff5d8f','#0a0a0d'],
    ['#c084fc','#f472b6','#38bdf8','#fde047','#0a0a0d']
  ];
  let palette;
  const words=['SIGNAL','ENTROPY','HORIZON','FREQUENCY','PARALLAX','RESONANCE','VECTOR','SPECTRA','LATTICE','CASCADE'];
  const subwords=['study','variation','sequence','field','system','edition'];
  let title='', subtitle='';

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cvs.width=Math.floor(W*DPR);cvs.height=Math.floor(H*DPR);
    cvs.style.width=W+'px';cvs.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    compose();
  }

  function compose(){
    const rnd=mulberry32(seed);
    palette=PALETTES[Math.floor(rnd()*PALETTES.length)];
    title=words[Math.floor(rnd()*words.length)];
    subtitle=subwords[Math.floor(rnd()*subwords.length)];
    render();
  }

  function render(){
    const rnd=mulberry32(seed+7);
    const bg=palette[4];
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    // big soft gradient wash
    for(let i=0;i<3;i++){
      const x=rnd()*W,y=rnd()*H,r=Math.max(W,H)*(0.35+rnd()*0.5);
      const c=palette[Math.floor(rnd()*4)];
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,hexA(c,0.55));g.addColorStop(1,hexA(c,0));
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }

    // concentric arc fan
    ctx.globalCompositeOperation='screen';
    const ax=W*(0.2+rnd()*0.6), ay=H*(0.2+rnd()*0.6);
    const rings=5+Math.floor(rnd()*6);
    for(let i=0;i<rings;i++){
      ctx.beginPath();
      ctx.lineWidth=Math.max(6,Math.min(W,H)*0.012);
      ctx.strokeStyle=hexA(palette[i%4],0.5);
      ctx.arc(ax,ay,Math.min(W,H)*(0.06+i*0.045),rnd()*7,rnd()*7+2);
      ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';

    // halftone dot field in a band
    const bandY=H*(0.55+rnd()*0.2);
    const dots=Math.floor((W/22));
    for(let i=0;i<dots;i++){
      for(let j=0;j<6;j++){
        const dx=i*22+11, dy=bandY+j*22+11;
        const s=1+rnd()*3.2;
        ctx.fillStyle=hexA(palette[Math.floor(rnd()*4)],0.20+rnd()*0.35);
        ctx.beginPath();ctx.arc(dx,dy,s,0,7);ctx.fill();
      }
    }

    // geometric blocks
    const blocks=3+Math.floor(rnd()*4);
    for(let i=0;i<blocks;i++){
      const c=palette[Math.floor(rnd()*4)];
      ctx.save();
      ctx.globalAlpha=0.85;
      ctx.translate(rnd()*W, rnd()*H);
      ctx.rotate((rnd()-0.5)*1.2);
      if(rnd()<0.5){
        ctx.fillStyle=hexA(c,0.85);
        const w=W*(0.08+rnd()*0.18), h=w*(0.3+rnd()*0.9);
        ctx.fillRect(-w/2,-h/2,w,h);
      } else {
        ctx.beginPath();
        const r=Math.min(W,H)*(0.06+rnd()*0.14);
        ctx.arc(0,0,r,0,7);
        ctx.fillStyle=hexA(c,0.7);ctx.fill();
        ctx.lineWidth=Math.max(3,r*0.12);
        ctx.strokeStyle=hexA(palette[(i+1)%4],0.9);
        ctx.beginPath();ctx.arc(0,0,r*0.6,0,7);ctx.stroke();
      }
      ctx.restore();
    }

    // fine grid lines
    ctx.strokeStyle=hexA('#ffffff',0.05);ctx.lineWidth=1;
    const step=Math.max(40,Math.min(W,H)/14);
    for(let x=0;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // poster typography block
    const pad=Math.max(28,W*0.05);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.font=`900 ${Math.min(W*0.13,H*0.18)}px 'Archivo Black', sans-serif`;
    ctx.fillStyle='#f6f6ff';
    ctx.fillText(title, pad, H-pad-Math.min(H*0.06));
    ctx.font=`700 ${Math.min(W*0.02,H*0.03)}px 'Space Mono', monospace`;
    ctx.fillStyle=hexA(palette[1],0.95);
    ctx.fillText(('NO. '+String(seed).padStart(6,'0')) , pad, pad+18);
    ctx.fillStyle=hexA('#ffffff',0.6);
    ctx.fillText(subtitle.toUpperCase()+'  /  GENERATIVE EDITION', pad, H-pad-Math.min(H*0.06)+Math.min(W*0.028,H*0.042));

    // corner rule
    ctx.strokeStyle=hexA('#ffffff',0.25);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(pad,H-pad-Math.min(H*0.075));ctx.lineTo(W-pad,H-pad-Math.min(H*0.075));ctx.stroke();

    // ambient living light — slow drifting sheen keyed to time (poster stays deterministic per seed)
    const tt=ambT;
    const sx=W*(0.5+0.42*Math.cos(tt*0.23));
    const sy=H*(0.5+0.42*Math.sin(tt*0.19));
    ctx.globalCompositeOperation='screen';
    const sheen=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.min(W,H)*0.6);
    sheen.addColorStop(0,hexA(palette[0],0.10+0.05*Math.sin(tt*0.7)));
    sheen.addColorStop(1,hexA(palette[0],0));
    ctx.fillStyle=sheen;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';

    // vignette
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }

  function hexA(hex,a){
    const n=parseInt(hex.slice(1),16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  // gentle ambient motion: re-render with a slow time keyed sheen (deterministic per seed)
  let ambT=0;
  function loop(){
    ambT+=0.008;
    render();
    requestAnimationFrame(loop);
  }
  cvs.addEventListener('click',()=>{ seed=Math.floor(Math.random()*1e6); compose(); });
  addEventListener('resize',resize);
  resize();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

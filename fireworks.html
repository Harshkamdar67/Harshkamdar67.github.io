<!-- Fireworks — a night sky of launching rockets and gravity-driven particle bursts with glow trails -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fireworks</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#01020a;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:14px;bottom:14px;z-index:9;font:12px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:rgba(255,255,255,.5);background:rgba(10,12,22,.35);border:1px solid rgba(255,255,255,.1);
  padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);letter-spacing:.03em}
.badge a{color:rgba(190,210,255,.9);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Fireworks &middot; <a href="index.html">&larr; Gallery</a></div>
<script>
(()=>{
const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
let stars=[],starLayer,fxLayer,fxctx;

function makeLayers(){
  starLayer=document.createElement('canvas');
  starLayer.width=Math.floor(W*DPR);starLayer.height=Math.floor(H*DPR);
  const g=starLayer.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#050617');grad.addColorStop(0.55,'#03030e');grad.addColorStop(1,'#0a0c20');
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W*0.5,H*1.05,0,W*0.5,H*1.05,H*0.75);
  gl.addColorStop(0,'rgba(74,64,128,0.40)');gl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gl;g.fillRect(0,0,W,H);
  stars=[];
  const count=Math.floor(W*H/4200);
  for(let i=0;i<count;i++){
    const x=Math.random()*W,y=Math.random()*H*0.88,r=Math.random()*1.3+0.2;
    const a=Math.random()*0.6+0.2;
    g.globalAlpha=a;g.fillStyle='#dfe8ff';
    g.beginPath();g.arc(x,y,r,0,6.283);g.fill();
    stars.push({x,y,r,a,ph:Math.random()*6.283});
  }
  g.globalAlpha=1;

  fxLayer=document.createElement('canvas');
  fxLayer.width=Math.floor(W*DPR);fxLayer.height=Math.floor(H*DPR);
  fxctx=fxLayer.getContext('2d');
  fxctx.setTransform(DPR,0,0,DPR,0,0);
  fxctx.fillStyle='#000';fxctx.fillRect(0,0,W,H);
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeLayers();
}
addEventListener('resize',resize);resize();

const rockets=[];
const MAXP=5000;
const PX=new Float32Array(MAXP),PY=new Float32Array(MAXP),PVX=new Float32Array(MAXP),PVY=new Float32Array(MAXP),
      PL=new Float32Array(MAXP),PM=new Float32Array(MAXP),PH=new Float32Array(MAXP),PS=new Uint8Array(MAXP);
let pcount=0;
const PALETTES=[[35,60],[180,220],[280,320],[0,20],[130,170],[300,340]];
const flashes=[];

function spawnParticle(x,y,vx,vy,life,hue,type){
  if(pcount>=MAXP)return;
  const i=pcount++;
  PX[i]=x;PY[i]=y;PVX[i]=vx;PVY[i]=vy;PL[i]=life;PM[i]=life;PH[i]=hue;PS[i]=type;
}
function burst(x,y){
  const pal=PALETTES[(Math.random()*PALETTES.length)|0];
  const h0=pal[0]+Math.random()*(pal[1]-pal[0]);
  const n=190+((Math.random()*180)|0);
  const pow=5.0+Math.random()*3.6;
  const ring=Math.random()<0.4;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283;
    const sp=ring?pow*(0.9+Math.random()*0.12):pow*Math.pow(Math.random(),0.5);
    const hue=h0+(Math.random()-0.5)*34;
    spawnParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,90+Math.random()*80,hue,Math.random()<0.35?1:0);
  }
  flashes.push({x,y,l:1});
}
function launch(tx,ty){
  rockets.push({x:W*0.5+(Math.random()-0.5)*W*0.3,y:H+10,vx:(tx-W*0.5)*0.004,vy:-(18+Math.random()*4),tx,ty,hue:Math.random()*360});
}

let autoTimer=0;
addEventListener('pointerdown',e=>launch(e.clientX,Math.min(e.clientY,H*0.72)));

function frame(){
  const g=fxctx;
  g.globalCompositeOperation='source-over';
  g.fillStyle='rgba(0,0,0,0.15)';
  g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';

  // rockets
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.x+=r.vx;r.y+=r.vy;r.vy+=0.28;
    g.fillStyle='hsla('+r.hue+',80%,85%,0.95)';
    g.beginPath();g.arc(r.x,r.y,2.4,0,6.283);g.fill();
    g.strokeStyle='hsla('+r.hue+',85%,70%,0.8)';g.lineWidth=2;
    g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x-r.vx*3.4,r.y-r.vy*3.4);g.stroke();
    if(r.y<=r.ty||r.vy>=0){burst(r.x,r.y);rockets.splice(i,1);}
  }

  // particles
  for(let i=pcount-1;i>=0;i--){
    PL[i]--;
    if(PL[i]<=0){
      const last=--pcount;
      if(i!==last){PX[i]=PX[last];PY[i]=PY[last];PVX[i]=PVX[last];PVY[i]=PVY[last];PL[i]=PL[last];PM[i]=PM[last];PH[i]=PH[last];PS[i]=PS[last];}
      continue;
    }
    PVY[i]+=0.045;
    PVX[i]*=0.991;PVY[i]*=0.991;
    PX[i]+=PVX[i];PY[i]+=PVY[i];
    const lf=PL[i]/PM[i];
    let alpha=lf*0.95;
    if(PS[i]===1&&PL[i]%4<2)alpha*=0.3;
    g.fillStyle='hsla('+PH[i]+',95%,'+(58+lf*28)+'%,'+alpha+')';
    g.beginPath();g.arc(PX[i],PY[i],1.5+lf*1.8,0,6.283);g.fill();
  }

  // flashes
  for(let i=flashes.length-1;i>=0;i--){
    const f=flashes[i];f.l-=0.07;
    if(f.l<=0){flashes.splice(i,1);continue;}
    const rg=g.createRadialGradient(f.x,f.y,0,f.x,f.y,150*f.l);
    rg.addColorStop(0,'rgba(255,240,210,'+(f.l*0.45)+')');
    rg.addColorStop(1,'rgba(255,240,210,0)');
    g.fillStyle=rg;g.beginPath();g.arc(f.x,f.y,150*f.l,0,6.283);g.fill();
  }

  // composite sky + fx
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(starLayer,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const t=performance.now()*0.002;
  for(let i=0;i<stars.length;i+=6){
    const s=stars[i];
    const tw=s.a*(0.45+0.55*Math.sin(t+s.ph));
    ctx.fillStyle='rgba(223,232,255,'+(tw*0.9)+')';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*1.6,0,6.283);ctx.fill();
  }
  ctx.drawImage(fxLayer,0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  autoTimer--;
  if(autoTimer<=0){
    autoTimer=26+((Math.random()*46)|0);
    launch(W*0.12+Math.random()*W*0.76,H*0.14+Math.random()*H*0.32);
  }
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>

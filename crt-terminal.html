<!-- Concept: CRT Phosphor Terminal Boot -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#050805; }

  .room{
    position:fixed; inset:0;
    background:radial-gradient(ellipse at 50% 45%, #10160f 0%, #050805 75%);
    display:grid; place-items:center;
  }

  /* the physical monitor */
  .monitor{
    position:relative;
    width:min(92vw, 1100px);
    height:min(86vh, 720px);
    border-radius:26px;
    background:linear-gradient(160deg, #2a2c26, #141511 55%, #0c0d0a);
    padding:26px;
    box-shadow:
      0 40px 80px rgba(0,0,0,.75),
      inset 0 2px 2px rgba(255,255,255,.06),
      inset 0 -3px 8px rgba(0,0,0,.6);
  }

  /* the glass tube */
  .tube{
    position:relative; width:100%; height:100%;
    border-radius:16px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 42%, #04160a 0%, #010602 70%, #000 100%);
    box-shadow:
      inset 0 0 60px rgba(0,0,0,.9),
      inset 0 0 14px rgba(0,255,120,.14),
      0 0 40px rgba(0,255,110,.10);
  }

  /* text layer */
  .term{
    position:absolute; inset:0;
    padding:4.2% 4.6%;
    font-family:'VT323', monospace;
    font-size:clamp(15px, 2.05vw, 25px);
    line-height:1.28;
    color:#8dffb8;
    text-shadow:0 0 4px rgba(120,255,170,.85), 0 0 12px rgba(60,255,140,.45);
    white-space:pre-wrap; word-break:break-word;
    letter-spacing:.02em;
    overflow:hidden;
    z-index:3;
  }
  .term .dim{ color:#4fbf7e; text-shadow:0 0 6px rgba(80,220,140,.5); }
  .term .bright{ color:#d8ffe8; }
  .term .warn{ color:#ffd479; text-shadow:0 0 6px rgba(255,200,90,.7); }
  .term .ok{ color:#9dffcf; }
  .cur{
    display:inline-block; width:.6em; height:1.05em; margin-left:1px;
    background:#9dffcf; vertical-align:-.18em;
    box-shadow:0 0 8px rgba(150,255,200,.9);
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{ 0%,50%{opacity:1;} 50.01%,100%{opacity:0;} }

  /* scanlines */
  .scan{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background:repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.35) 2px 3px);
    mix-blend-mode:multiply; opacity:.85;
  }
  /* aperture grille hint */
  .grille{
    position:absolute; inset:0; z-index:6; pointer-events:none; opacity:.16;
    background:repeating-linear-gradient(90deg,
      rgba(255,0,60,.5) 0 1px, rgba(0,255,90,.5) 1px 2px, rgba(40,120,255,.5) 2px 3px);
    mix-blend-mode:screen;
  }
  /* rolling refresh bar */
  .roll{
    position:absolute; left:0; right:0; height:22%; z-index:7; pointer-events:none;
    background:linear-gradient(to bottom, rgba(180,255,210,0), rgba(180,255,210,.05), rgba(180,255,210,0));
    animation:roll 7s linear infinite;
  }
  @keyframes roll{ 0%{ top:-25%; } 100%{ top:105%; } }
  /* flicker + vignette */
  .flick{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%);
    animation:flick 2.3s steps(1) infinite;
  }
  @keyframes flick{
    0%,93%,100%{ opacity:1; }
    94%{ opacity:.82; } 95%{ opacity:1; } 96%{ opacity:.9; } 97%{ opacity:1; }
  }
  /* glass highlight */
  .glare{
    position:absolute; inset:0; z-index:9; pointer-events:none;
    background:linear-gradient(125deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 32%);
  }

  .badge{
    position:fixed; left:14px; bottom:12px; z-index:20;
    font-family:'VT323', monospace; font-size:14px; letter-spacing:.1em;
    color:rgba(140,255,190,.62); text-transform:uppercase;
    background:rgba(2,16,8,.5); border:1px solid rgba(120,255,170,.22);
    padding:5px 10px; border-radius:4px; backdrop-filter:blur(3px); user-select:none;
  }
  .badge a{ color:rgba(170,255,210,.9); text-decoration:none; }
  .badge a:hover{ text-shadow:0 0 8px rgba(120,255,170,.9); }

  #hiddenInput{ position:fixed; opacity:0; pointer-events:none; left:-9999px; }
</style>
</head>
<body>
<div class="room">
  <div class="monitor">
    <div class="tube">
      <div class="term" id="term"></div>
      <div class="scan"></div>
      <div class="grille"></div>
      <div class="roll"></div>
      <div class="flick"></div>
      <div class="glare"></div>
    </div>
  </div>
</div>
<div class="badge">CRT Terminal &nbsp;<a href="index.html">&larr; Gallery</a></div>
<input id="hiddenInput" autocomplete="off" spellcheck="false">
<script>
(function(){
  const term = document.getElementById('term');
  const input = document.getElementById('hiddenInput');

  const BOOT = [
    {t:'ARJUN-BIOS v4.11  (C) 1987 Northern Microsystems', c:'dim'},
    {t:'', c:''},
    {t:'Main Memory Test ......... 640K OK', c:'dim'},
    {t:'Extended Memory .......... 8192K OK', c:'dim'},
    {t:'Detecting drives ......... C: D: E: OK', c:'dim'},
    {t:'', c:''},
    {t:'Loading kernel /vmunix ................ OK', c:'ok'},
    {t:'Mounting root filesystem .............. OK', c:'ok'},
    {t:'Starting network daemons .............. OK', c:'ok'},
    {t:'', c:''},
    {t:'WARNING: atmospheric sensor drift 0.42%', c:'warn'},
    {t:'Calibrating CRT phosphor decay ........ OK', c:'ok'},
    {t:'', c:''},
    {t:'N O R T H E R N   T E R M I N A L', c:'bright'},
    {t:'node-07 :: secure shell established', c:'dim'},
    {t:'', c:''},
    {t:'Type HELP for available commands.', c:'dim'},
    {t:'', c:''},
  ];

  let li = 0, ci = 0;
  let buffer = '';

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderCursor(){
    return '<span class="cur"></span>';
  }

  function paint(extra){
    // rebuild full DOM text each frame (cheap enough, lines are short)
    term.innerHTML = extra + renderCursor();
  }

  let out = '';
  function typeLine(){
    if(li >= BOOT.length){ ready(); return; }
    const line = BOOT[li];
    if(ci === 0){ /* start line */ }
    if(ci < line.t.length){
      ci++;
      const shown = line.t.slice(0, ci);
      paint(out + '<span class="'+line.c+'">' + esc(shown) + '</span>\n');
      const delay = 6 + Math.random()*14;
      setTimeout(typeLine, delay);
    } else {
      out += '<span class="'+line.c+'">' + esc(line.t) + '</span>\n';
      li++; ci = 0;
      setTimeout(typeLine, line.t ? 60 + Math.random()*160 : 30);
    }
  }

  let readyFlag = false;
  function ready(){
    if(readyFlag) return; readyFlag = true;
    prompt();
    input.focus();
  }

  function prompt(){
    paint(out + '<span class="bright">guest@node-07:~$</span> ' + esc(buffer));
  }

  const HISTORY = {};
  HISTORY['HELP'] = [
    'COMMANDS:',
    '  HELP      show this list',
    '  WHOAMI    identity of this session',
    '  STATUS    system diagnostics',
    '  SCAN      sweep the perimeter',
    '  CLEAR     wipe the screen',
    '  EXIT      close the link'
  ];
  HISTORY['WHOAMI'] = ['guest :: uid 1000 :: clearance CIVILIAN'];
  HISTORY['STATUS'] = [
    'CORE ......... NOMINAL',
    'UPLINK ....... 98.4% SYNC',
    'PHOSPHOR ..... 72% LIFE REMAINING',
    'TEMPERATURE .. 41.0 C'
  ];
  HISTORY['SCAN'] = [
    'sweeping sector 7G ...',
    '..... contact bearing 041 / range 12km',
    '..... contact bearing 118 / range 04km',
    'no hostile signatures. sector clear.'
  ];
  HISTORY['EXIT'] = ['link closed. goodbye.'];

  function submit(){
    const raw = buffer;
    const cmd = raw.trim().toUpperCase();
    out += '<span class="bright">guest@node-07:~$</span> ' + esc(raw) + '\n';
    buffer = '';
    if(cmd === 'CLEAR'){ out = ''; }
    else if(cmd === ''){ /* nothing */ }
    else if(HISTORY[cmd]){
      HISTORY[cmd].forEach(l => { out += '<span class="dim">' + esc(l) + '</span>\n'; });
    } else {
      out += '<span class="warn">' + esc(cmd.toLowerCase()) + ': command not found</span>\n';
    }
    prompt();
  }

  window.addEventListener('keydown', e=>{
    if(!readyFlag) return;
    if(e.key === 'Enter'){ e.preventDefault(); submit(); }
    else if(e.key === 'Backspace'){ e.preventDefault(); buffer = buffer.slice(0,-1); prompt(); }
    else if(e.key.length === 1){ buffer += e.key; prompt(); }
  });
  window.addEventListener('click', ()=>{ if(readyFlag) input.focus(); });
  input.addEventListener('input', ()=>{ input.value=''; });

  // power-on flash
  const tube = document.querySelector('.tube');
  tube.animate([{opacity:0, filter:'brightness(3)'},{opacity:1, filter:'brightness(1)'}], {duration:520, easing:'ease-out'});

  setTimeout(typeLine, 700);
})();
</script>
</body>
</html>

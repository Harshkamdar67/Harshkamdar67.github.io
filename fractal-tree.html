<!-- Fractal Tree — a recursive tree swaying in the wind, its leaves glowing like embers -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fractal Tree</title>
<style>
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden;}
  canvas#c{display:block;width:100vw;height:100vh;}
  .badge{position:fixed;left:14px;bottom:14px;z-index:5;
    font:12px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
    color:rgba(255,255,255,.6);background:rgba(6,8,18,.42);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 13px;letter-spacing:.03em;}
  .badge a{color:rgba(255,255,255,.86);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.28);}
  .badge a:hover{color:#fff;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Fractal Tree &nbsp;&middot;&nbsp; <a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c');
var ctx=cv.getContext('2d');
var DPR=Math.min(window.devicePixelRatio||1,2);
var W=0,H=0;
function resize(){
  W=Math.max(1,Math.floor(window.innerWidth*DPR));
  H=Math.max(1,Math.floor(window.innerHeight*DPR));
  cv.width=W; cv.height=H;
  cv.style.width=window.innerWidth+'px'; cv.style.height=window.innerHeight+'px';
}
window.addEventListener('resize',resize);
resize();

/* glowing leaf sprites */
var SPRITES=[];
function makeLeaf(hue){
  var s=64, c=document.createElement('canvas');
  c.width=c.height=s;
  var g=c.getContext('2d');
  var grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0,'hsla('+hue+',100%,95%,1)');
  grd.addColorStop(0.13,'hsla('+hue+',100%,76%,0.55)');
  grd.addColorStop(0.42,'hsla('+hue+',100%,62%,0.13)');
  grd.addColorStop(1,'hsla('+hue+',100%,58%,0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  return c;
}
[150,168,190,44,320].forEach(function(h){ SPRITES.push(makeLeaf(h)); });

/* tree parameters (reseedable) */
var maxD=11;
var baseLen=0.155, lenF=0.75, spreadBase=0.355, seedJit=0;
function reseed(){ seedJit=Math.random()*1000; }
reseed();

var mx=0.5, wind=0, t=0;
window.addEventListener('pointermove',function(e){ mx=e.clientX/window.innerWidth; });
window.addEventListener('touchmove',function(e){ if(e.touches[0]) mx=e.touches[0].clientX/window.innerWidth; },{passive:true});
window.addEventListener('pointerdown',function(){ reseed(); });

var paths=[], leaves=[];
for(var d=0;d<=maxD;d++) paths.push(new Path2D());

function colorFor(d){
  var u=d/maxD;
  var r=Math.round(56+u*80);
  var g=Math.round(70+u*180);
  var b=Math.round(150+u*105);
  return 'rgb('+r+','+g+','+b+')';
}

function grow(x,y,ang,len,dep){
  if(dep>maxD) return;
  var sway=wind*(0.02+0.34*(dep/maxD))+Math.sin(t*1.1+seedJit+x*0.004+dep)*0.008;
  var a=ang+sway;
  var x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len;
  paths[dep].moveTo(x,y); paths[dep].lineTo(x2,y2);
  if(dep===maxD){ leaves.push(x2,y2); return; }
  var sp=spreadBase+Math.sin(t*0.5+x*0.006+seedJit)*0.05;
  grow(x2,y2,a-sp, len*lenF, dep+1);
  grow(x2,y2,a+sp, len*lenF, dep+1);
}

var last=0;
function frame(now){
  if(!last) last=now;
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  t+=dt;

  wind=Math.sin(t*0.6)*0.5+Math.sin(t*0.23+1.7)*0.35+(mx-0.5)*1.5;

  var bg=ctx.createRadialGradient(W*0.5,H*1.05,0,W*0.5,H*1.05,Math.max(W,H)*0.95);
  bg.addColorStop(0,'rgba(16,22,48,1)');
  bg.addColorStop(0.5,'rgba(8,10,26,1)');
  bg.addColorStop(1,'rgba(3,4,10,1)');
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  for(var d=0;d<=maxD;d++) paths[d]=new Path2D();
  leaves.length=0;
  grow(W*0.5, H*0.985, -Math.PI/2, Math.min(W,H)*baseLen, 0);

  ctx.lineCap='round';
  for(var dd=0;dd<=maxD;dd++){
    ctx.strokeStyle=colorFor(dd);
    ctx.lineWidth=Math.max(0.8, Math.min(W,H)*0.011*Math.pow(0.72,dd));
    ctx.stroke(paths[dd]);
  }

  ctx.globalCompositeOperation='lighter';
  var ls=Math.min(W,H)*0.0082;
  for(var i=0;i<leaves.length;i+=2){
    var lx=leaves[i], ly=leaves[i+1];
    var sp=SPRITES[(Math.abs((lx*0.11+ly*0.07)|0))%SPRITES.length];
    var a=0.16+0.12*Math.sin(t*2.0+lx*0.03+ly*0.02);
    ctx.globalAlpha=a;
    var s=ls*(0.8+0.4*((Math.abs((lx*0.03+ly*0.05)|0))%10)/10);
    ctx.drawImage(sp,lx-s,ly-s,s*2,s*2);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!-- Peter de Jong Attractor — a strange-attractor density plot drifting through parameter space -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>de Jong Attractor</title>
<style>
  html,body{margin:0;height:100%;background:#03030c;overflow:hidden;}
  canvas#c{display:block;width:100vw;height:100vh;}
  .badge{position:fixed;left:14px;bottom:14px;z-index:5;
    font:12px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
    color:rgba(255,255,255,.6);background:rgba(6,6,20,.42);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 13px;letter-spacing:.03em;}
  .badge a{color:rgba(255,255,255,.86);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.28);}
  .badge a:hover{color:#fff;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">de Jong Attractor &nbsp;&middot;&nbsp; <a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c');
var ctx=cv.getContext('2d',{alpha:false});
var off=document.createElement('canvas');
var octx=off.getContext('2d',{alpha:false});

var DPR=Math.min(window.devicePixelRatio||1,2);
var W=0,H=0,bw=0,bh=0,dens=null,imgd=null,data=null;

/* palette LUT */
var LUT=new Uint8Array(256*3);
(function(){
  var stops=[
    [0.00,  4, 6,22],
    [0.16, 22,22,78],
    [0.36, 76,32,150],
    [0.56,168,44,152],
    [0.74,244,92,118],
    [0.90,255,176,92],
    [1.00,255,246,222]
  ];
  for(var i=0;i<256;i++){
    var u=i/255, k=0;
    while(k<stops.length-2 && u>stops[k+1][0]) k++;
    var s0=stops[k], s1=stops[k+1];
    var f=(u-s0[0])/(s1[0]-s0[0]);
    if(f<0)f=0; if(f>1)f=1;
    LUT[i*3  ]=s0[1]+(s1[1]-s0[1])*f;
    LUT[i*3+1]=s0[2]+(s1[2]-s0[2])*f;
    LUT[i*3+2]=s0[3]+(s1[3]-s0[3])*f;
  }
})();

function resize(){
  W=Math.max(1,Math.floor(window.innerWidth*DPR));
  H=Math.max(1,Math.floor(window.innerHeight*DPR));
  cv.width=W; cv.height=H;
  cv.style.width=window.innerWidth+'px'; cv.style.height=window.innerHeight+'px';
  bw=Math.min(720, W);
  bh=Math.max(1,Math.round(bw*H/W));
  off.width=bw; off.height=bh;
  dens=new Float32Array(bw*bh);
  imgd=octx.createImageData(bw,bh);
  data=imgd.data;
  ctx.fillStyle='#03030c'; ctx.fillRect(0,0,W,H);
}
window.addEventListener('resize',resize);
resize();

var px=Math.random()*2-1, py=Math.random()*2-1;
function reseed(){ px=Math.random()*2-1; py=Math.random()*2-1; }
window.addEventListener('pointerdown',reseed);
window.addEventListener('dblclick',reseed);

var mx=0.5,my=0.5;
window.addEventListener('pointermove',function(e){ mx=e.clientX/window.innerWidth; my=e.clientY/window.innerHeight; });
window.addEventListener('touchmove',function(e){ if(e.touches[0]){mx=e.touches[0].clientX/window.innerWidth;my=e.touches[0].clientY/window.innerHeight;} },{passive:true});

var t=0,last=0, ITER=70000;

function frame(now){
  if(!last) last=now;
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  t+=dt;

  var a=1.4+0.35*Math.sin(t*0.07);
  var b=-2.3+0.30*Math.sin(t*0.051+1.0)+(mx-0.5)*0.8;
  var c=2.4+0.30*Math.sin(t*0.09+2.0);
  var d=-2.1+0.30*Math.sin(t*0.06+3.0)+(my-0.5)*0.8;

  /* decay */
  var i, L=dens.length;
  for(i=0;i<L;i++) dens[i]*=0.986;

  var x=px, y=py;
  var q4w=bw*0.25, q4h=bh*0.25;
  for(var s=0;s<ITER;s++){
    var nx=Math.sin(a*y)-Math.cos(b*x);
    var ny=Math.sin(c*x)-Math.cos(d*y);
    x=nx; y=ny;
    var ix=((x+2)*q4w)|0;
    var iy=((y+2)*q4h)|0;
    if(ix>=0 && ix<bw && iy>=0 && iy<bh) dens[iy*bw+ix]+=1;
  }
  px=x; py=y;

  /* tone-map + colour */
  for(i=0;i<L;i++){
    var e=1-Math.exp(-dens[i]*0.030);
    var idx=(e*255)|0;
    var p=i<<2;
    data[p]=LUT[idx*3]; data[p+1]=LUT[idx*3+1]; data[p+2]=LUT[idx*3+2]; data[p+3]=255;
  }
  octx.putImageData(imgd,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,bw,bh,0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>

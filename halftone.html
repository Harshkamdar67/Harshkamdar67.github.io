<!-- Concept: Halftone Print Screens -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halftone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#f1ece0; }
  canvas{ display:block; width:100vw; height:100vh; }
  .paper{ position:fixed; inset:0; z-index:4; pointer-events:none; opacity:.5;
    background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 55%, rgba(120,90,50,.16) 100%); }
  .grain{ position:fixed; inset:0; z-index:5; pointer-events:none; opacity:.06; mix-blend-mode:multiply; }
  .stamp{
    position:fixed; top:26px; right:30px; z-index:6; text-align:right;
    font-family:'Archivo Black', sans-serif; text-transform:uppercase;
    color:#1a1a1a; letter-spacing:.02em; line-height:1;
    font-size:clamp(16px,2.4vw,30px);
  }
  .stamp small{ display:block; font-family:'Share Tech Mono',monospace; font-weight:400;
    font-size:11px; letter-spacing:.4em; color:#8a3b2e; margin-top:8px; }
  .badge{ position:fixed; left:14px; bottom:12px; z-index:20;
    font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:.12em;
    color:rgba(40,30,20,.6); text-transform:uppercase;
    background:rgba(255,250,240,.5); border:1px solid rgba(60,40,20,.22);
    padding:6px 10px; border-radius:4px; backdrop-filter:blur(3px); user-select:none; }
  .badge a{ color:rgba(30,20,10,.85); text-decoration:none; }
  .badge a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas class="grain" id="grain"></canvas>
<div class="paper"></div>
<div class="stamp">Halftone<small>cmyk &middot; 45&deg; screen</small></div>
<div class="badge">Halftone &nbsp;<a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W,H,dpr, SP, cols, rows, ox, oy;

  function size(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    SP = Math.max(11, Math.round(Math.min(W,H)/64));
    cols = Math.ceil(W/SP)+2; rows = Math.ceil(H/SP)+2;
    ox = (W - (cols-1)*SP)/2; oy = (H - (rows-1)*SP)/2;
  }
  size(); window.addEventListener('resize', size);

  // paper grain
  const gr = document.getElementById('grain');
  const gx = gr.getContext('2d');
  function grain(){
    gr.width = Math.floor(W/2); gr.height = Math.floor(H/2);
    gr.style.width=W+'px'; gr.style.height=H+'px';
    const img = gx.createImageData(gr.width, gr.height);
    for(let i=0;i<img.data.length;i+=4){
      const v = 200 + (Math.random()*55|0);
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
    }
    gx.putImageData(img,0,0);
  }
  grain();

  // pointer controls the light direction
  let lightAngle = -0.6;
  let tlx=0, tly=0;
  window.addEventListener('mousemove', e=>{ tlx = (e.clientX/W-0.5)*2; tly = (e.clientY/H-0.5)*2; });
  window.addEventListener('touchmove', e=>{ if(e.touches[0]){ tlx=(e.touches[0].clientX/W-0.5)*2; tly=(e.touches[0].clientY/H-0.5)*2; } }, {passive:true});
  let lx=0, ly=0;

  function lumAt(px, py, t){
    // normalized coords centered on the viewport, aspect corrected
    const nx = (px-W/2)/(Math.min(W,H)*0.5);
    const ny = (py-H/2)/(Math.min(W,H)*0.5);
    const r2 = nx*nx + ny*ny;

    // main sphere
    let lum = 0;
    if(r2 < 1){
      const nz = Math.sqrt(1-r2);
      // rotate normal slightly over time
      const ca=Math.cos(t*0.5), sa=Math.sin(t*0.5);
      const rx = nx*ca - nz*sa, rz = nx*sa + nz*ca;
      const L = Math.max(0, rx*lx + ny*ly + nz*0.62);
      lum = L*0.9 + 0.06;
    }
    // orbiting ring (torus cross-section in screen space)
    const ringR = 0.72;
    const d = Math.abs(Math.sqrt(r2) - ringR);
    if(d < 0.13){
      const band = 1 - d/0.13;
      const ang = Math.atan2(ny,nx);
      const sh = 0.5 + 0.5*Math.sin(ang*1 + t*1.2);
      lum = Math.max(lum, band*sh*0.95);
    }
    // small moons
    for(let i=0;i<3;i++){
      const a = t*0.6 + i*2.094;
      const mx = Math.cos(a)*1.05, my = Math.sin(a)*1.05;
      const md = Math.hypot(nx-mx, ny-my);
      if(md < 0.13){ lum = Math.max(lum, (1-md/0.13)*0.85); }
    }
    return Math.min(1, lum);
  }

  // three rotated screens (CMYK-ish)
  const screens = [
    { col:'#141414', ang: Math.PI/4,  offx:0,  offy:0,  mul:1.0,  gain:1.0 },
    { col:'#e8362a', ang: Math.PI/12, offx:2,  offy:-2, mul:0.85, gain:0.9 },
    { col:'#1f6fe0', ang: Math.PI*0.75, offx:-2, offy:2, mul:0.85, gain:0.9 },
  ];

  function draw(now){
    const t = now*0.001;
    // light orbits on its own, and the pointer nudges it
    const autoX = 0.60*Math.cos(t*0.35);
    const autoY = -0.50 + 0.30*Math.sin(t*0.27);
    const tgx = autoX + tlx*0.6;
    const tgy = autoY + tly*0.6;
    lx += (tgx-lx)*0.06; ly += (tgy-ly)*0.06;

    // paper base
    ctx.fillStyle = '#f1ece0';
    ctx.fillRect(0,0,W,H);

    const R = SP*0.62;

    screens.forEach(s=>{
      const ca=Math.cos(s.ang), sa=Math.sin(s.ang);
      const path = new Path2D();
      // build in rotated space: iterate over a rotated lattice covering the screen
      const diag = Math.ceil(Math.hypot(W,H)/SP)+2;
      for(let j=-diag; j<=diag; j++){
        for(let i=-diag; i<=diag; i++){
          // lattice point in screen space (rotated)
          const ux = i*SP, uy = j*SP;
          const px = W/2 + ux*ca - uy*sa + s.offx;
          const py = H/2 + ux*sa + uy*ca + s.offy;
          if(px<-SP||px>W+SP||py<-SP||py>H+SP) continue;
          const l = lumAt(px, py, t) * s.gain;
          if(l <= 0.02) continue;
          const r = R * Math.sqrt(l) * s.mul;
          if(r < 0.35) continue;
          path.moveTo(px+r, py);
          path.arc(px, py, r, 0, Math.PI*2);
        }
      }
      ctx.fillStyle = s.col;
      ctx.globalAlpha = 0.92;
      ctx.fill(path);
      ctx.globalAlpha = 1;
    });

    // registration marks + crop ticks (print feel)
    ctx.strokeStyle = 'rgba(20,20,20,0.5)'; ctx.lineWidth = 1;
    const m = 24;
    [[m,m],[W-m,m],[m,H-m],[W-m,H-m]].forEach(p=>{
      ctx.beginPath(); ctx.arc(p[0],p[1],7,0,Math.PI*2); ctx.moveTo(p[0]-12,p[1]); ctx.lineTo(p[0]+12,p[1]); ctx.moveTo(p[0],p[1]-12); ctx.lineTo(p[0],p[1]+12); ctx.stroke();
    });
    ctx.fillStyle = 'rgba(20,20,20,0.6)';
    ctx.font = '10px "Share Tech Mono", monospace';
    ctx.fillText('K 45\u00B0  M 15\u00B0  C 75\u00B0', m+18, H-m+4);
    ctx.fillText('screen '+SP+'px', W-m-110, H-m+4);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>

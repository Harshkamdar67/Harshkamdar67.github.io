<!-- Concept 31: Verlet Cloth — a hanging cloth rippling in the wind, draggable with the mouse -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verlet Cloth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060b}
  canvas{display:block;width:100vw;height:100vh}
  .badge{
    position:fixed;left:14px;bottom:14px;z-index:10;
    font:600 10px/1.3 'Inter',system-ui,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(220,235,255,.62);
    background:rgba(8,12,22,.42);
    border:1px solid rgba(140,190,255,.16);
    padding:7px 12px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:10px;align-items:center;pointer-events:none;
    white-space:nowrap;
  }
  .badge a{pointer-events:auto;color:rgba(120,205,255,.85);text-decoration:none;transition:color .2s}
  .badge a:hover{color:#fff}
  .badge .sep{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge"><span>Verlet Cloth</span><span class="sep">/</span><a href="index.html">&larr; Gallery</a></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const COLS = 46, ROWS = 30;
  const SPACING = 1;
  const FRICTION = 0.985;
  const GRAVITY = 900;
  const ITER = 6;
  const TearDist = 2.4; // relative to spacing

  const points = [];
  const constraints = [];

  let originX = 0, originY = 0, gridW = 0, gridH = 0, sp = 0;

  function build() {
    points.length = 0; constraints.length = 0;
    sp = Math.min((W * 0.62) / COLS, (H * 0.66) / ROWS);
    gridW = (COLS - 1) * sp;
    gridH = (ROWS - 1) * sp;
    originX = (W - gridW) / 2;
    originY = H * 0.13;

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const px = originX + x * sp;
        const py = originY + y * sp;
        points.push({ x: px, y: py, ox: px, oy: py, pinned: false, bx: x, by: y });
      }
    }
    const idx = (x, y) => y * COLS + x;
    // pin the top row (whole top edge)
    for (let x = 0; x < COLS; x++) points[idx(x, 0)].pinned = true;

    const link = (a, b) => constraints.push({ a, b, len: sp * (Math.abs(points[a].bx - points[b].bx) + Math.abs(points[a].by - points[b].by)) });
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (x < COLS - 1) link(idx(x, y), idx(x + 1, y));
        if (y < ROWS - 1) link(idx(x, y), idx(x, y + 1));
        if (x < COLS - 1 && y < ROWS - 1) link(idx(x, y), idx(x + 1, y + 1));
        if (x > 0 && y < ROWS - 1) link(idx(x, y), idx(x - 1, y + 1));
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  // ---- interaction ----
  let drag = null; // index
  const mouse = { x: 0, y: 0 };
  function pos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function down(e) {
    const p = pos(e);
    let best = -1, bd = 1e9;
    for (let i = 0; i < points.length; i++) {
      const q = points[i];
      const d = (q.x - p.x) ** 2 + (q.y - p.y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    if (bd < (sp * 3) ** 2) { drag = best; mouse.x = p.x; mouse.y = p.y; }
    e.preventDefault();
  }
  function move(e) {
    const p = pos(e);
    mouse.x = p.x; mouse.y = p.y;
    if (drag !== null) e.preventDefault();
  }
  function up() { drag = null; }

  canvas.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);

  // ---- physics ----
  let t = 0;
  function step(dt) {
    t += dt;
    const dt2 = dt * dt;
    const wind = Math.sin(t * 1.1) * 0.6 + Math.sin(t * 2.3 + 1.7) * 0.3;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      if (p.pinned) { p.ox = p.x; p.oy = p.y; continue; }
      const vx = (p.x - p.ox) * FRICTION;
      const vy = (p.y - p.oy) * FRICTION;
      p.ox = p.x; p.oy = p.y;
      const gust = wind * (0.4 + 0.6 * (p.by / ROWS)) + Math.sin(t * 3.0 + p.bx * 0.35) * 0.35;
      const ax = gust * 900;
      const ay = GRAVITY;
      p.x += vx + ax * dt2;
      p.y += vy + ay * dt2;
    }
    if (drag !== null) {
      const p = points[drag];
      if (!p.pinned) { p.x = mouse.x; p.y = mouse.y; }
    }
    // constraints
    for (let k = 0; k < ITER; k++) {
      for (let i = 0; i < constraints.length; i++) {
        const c = constraints[i];
        const a = points[c.a], b = points[c.b];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy) || 1e-6;
        const diff = (d - c.len) / d * 0.5;
        const ox = dx * diff, oy = dy * diff;
        if (!a.pinned) { a.x += ox; a.y += oy; }
        if (!b.pinned) { b.x -= ox; b.y -= oy; }
      }
      // keep pinned exactly in place
      for (let x = 0; x < COLS; x++) {
        const p = points[x];
        p.x = originX + x * sp; p.y = originY;
      }
    }
  }

  function render() {
    ctx.fillStyle = 'rgba(5,6,11,0.30)';
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < constraints.length; i++) {
      const c = constraints[i];
      const a = points[c.a], b = points[c.b];
      const y = (a.by / ROWS);
      const hue = 190 + y * 90 + Math.sin(t + a.bx * 0.2) * 18;
      const alpha = 0.10 + 0.16 * (1 - y) + 0.06 * Math.abs(a.x - a.ox);
      ctx.strokeStyle = 'hsla(' + hue + ',90%,' + (48 + 22 * (1 - y)) + '%,' + alpha + ')';
      ctx.lineWidth = 1.05;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // bright nodes on a sparse grid
    ctx.globalCompositeOperation = 'lighter';
    for (let y = 0; y < ROWS; y += 3) {
      for (let x = 0; x < COLS; x += 3) {
        const p = points[y * COLS + x];
        const spd = Math.hypot(p.x - p.ox, p.y - p.oy);
        const r = 1.1 + Math.min(spd * 0.9, 2.6);
        ctx.fillStyle = 'hsla(' + (196 + p.by / ROWS * 80) + ',95%,72%,' + (0.30 + Math.min(spd, 0.6)) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---- loop ----
  const FIXED = 1 / 120;
  let acc = 0, last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 8) { step(FIXED); acc -= FIXED; guard++; }
    if (guard >= 8) acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

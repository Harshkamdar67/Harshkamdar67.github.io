<!-- svg-waveform — Pulsing Audio Waveform Field -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waveform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04080a;overflow:hidden}
  body{font-family:'IBM Plex Mono',monospace}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .badge{position:fixed;left:18px;bottom:18px;z-index:10;display:inline-flex;gap:10px;align-items:baseline;
    padding:7px 14px;border:1px solid rgba(180,255,120,.22);border-radius:999px;background:rgba(6,16,14,.5);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);color:rgba(210,240,215,.7);
    text-decoration:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;
    transition:opacity .4s,border-color .4s}
  .badge:hover{opacity:1;border-color:rgba(180,255,120,.55)}
  .badge .t{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:none;color:rgba(230,255,235,.95)}
  .badge .g{color:rgba(210,240,215,.45)}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Pulsing audio waveform visualization">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1fb6a6"/>
      <stop offset="42%" stop-color="#c9ff3d"/>
      <stop offset="58%" stop-color="#c9ff3d"/>
      <stop offset="100%" stop-color="#1fb6a6"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fe6d0"/>
      <stop offset="45%" stop-color="#f2ff8a"/>
      <stop offset="55%" stop-color="#f2ff8a"/>
      <stop offset="100%" stop-color="#7fe6d0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9ff3d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#c9ff3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0a1a1c"/>
      <stop offset="60%" stop-color="#061012"/>
      <stop offset="100%" stop-color="#04080a"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g id="grid" stroke="#7fe6d0" stroke-opacity="0.07"></g>
  <g id="waves" stroke="#3fe0c4" fill="none" stroke-opacity="0.18"></g>
  <ellipse id="glow" cx="800" cy="450" rx="520" ry="240" fill="url(#glow)"/>
  <g id="bars"></g>
  <line x1="0" y1="450" x2="1600" y2="450" stroke="#c9ff3d" stroke-opacity="0.28" stroke-width="1"/>
  <g id="playhead" opacity="0"><line x1="0" y1="90" x2="0" y2="810" stroke="#f2ff8a" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 5"/></g>

  <text x="60" y="72" fill="#e6ffea" font-family="'Chakra Petch',sans-serif" font-weight="700" font-size="30" letter-spacing="4">WAVEFORM</text>
  <text x="62" y="98" fill="#5f8b7e" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="3">AMPLITUDE / TIME &#183; 48 kHz &#183; LIVE</text>
  <text x="60" y="838" fill="#5f8b7e" font-family="'IBM Plex Mono',monospace" font-size="12">0.0s</text>
  <text x="1540" y="838" text-anchor="end" fill="#5f8b7e" font-family="'IBM Plex Mono',monospace" font-size="12">4.0s</text>
</svg>
<a class="badge" href="index.html"><span class="t">Waveform</span><span class="g">&larr; Gallery</span></a>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var svg=document.getElementById("stage");
  var barsG=document.getElementById("bars"), wavesG=document.getElementById("waves"), grid=document.getElementById("grid");
  var CY=450, N=210, X0=60, X1=1540, BW=4.6, MAXH=330;
  var step=(X1-X0)/(N-1);
  for(var g=0;g<9;g++){
    var y=90+g*(720/8);
    var l=document.createElementNS(NS,"line");
    l.setAttribute("x1",0);l.setAttribute("x2",1600);l.setAttribute("y1",y);l.setAttribute("y2",y);
    l.setAttribute("stroke-dasharray",(g%2?"2 6":"0"));
    grid.appendChild(l);
  }
  var rects=[];
  for(var i=0;i<N;i++){
    var r=document.createElementNS(NS,"rect");
    r.setAttribute("x",(X0+i*step).toFixed(1)); r.setAttribute("width",BW.toFixed(1));
    r.setAttribute("rx","2"); r.setAttribute("fill","url(#bar)");
    barsG.appendChild(r); rects.push(r);
  }
  var WN=14, wpaths=[];
  for(var i=0;i<WN;i++){
    var p=document.createElementNS(NS,"path");
    p.setAttribute("stroke-width",(0.8+i*0.06).toFixed(2));
    wavesG.appendChild(p); wpaths.push(p);
  }
  var mx=800,tx=800,active=false;
  window.addEventListener("pointermove",function(e){
    var r=svg.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width*1600; active=true;
  },{passive:true});
  window.addEventListener("pointerleave",function(){active=false;});
  var playhead=document.getElementById("playhead"), phl=playhead.firstChild;
  function frame(now){
    mx+=(tx-mx)*0.12;
    var t=now/1000;
    for(var i=0;i<N;i++){
      var x=X0+i*step;
      var env=0.26+0.74*Math.pow(0.5+0.5*Math.sin(x*0.0072 + t*0.85),2.0);
      var fast=0.40+0.60*Math.abs(Math.sin(x*0.155 + t*4.1 + Math.sin(x*0.004+t)*2.0));
      var h=MAXH*env*fast;
      if(active){
        var d=x-mx, boost=Math.exp(-(d*d)/(2*140*140));
        h*=(1+1.05*boost);
      }
      h=Math.min(h,MAXH*1.15);
      var y=CY-h;
      rects[i].setAttribute("y",y.toFixed(1)); rects[i].setAttribute("height",(2*h).toFixed(1));
      rects[i].setAttribute("fill", (active && Math.abs(x-mx)<130) ? "url(#barHi)" : "url(#bar)");
    }
    for(var w=0;w<WN;w++){
      var off=(w-(WN-1)/2)*20, amp=42+Math.abs(w-(WN-1)/2)*11;
      var d2="";
      for(var x2=X0;x2<=X1;x2+=24){
        var yy=CY+off+amp*Math.sin(x2*0.006 + t*(0.6+w*0.09) + w*0.7)*Math.sin(t*0.35+w);
        d2+=(x2===X0?"M":" L")+x2+","+yy.toFixed(1);
      }
      wpaths[w].setAttribute("d",d2);
    }
    if(active){ playhead.setAttribute("opacity","1"); phl.setAttribute("x1",mx.toFixed(1)); phl.setAttribute("x2",mx.toFixed(1)); }
    else playhead.setAttribute("opacity","0");
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!-- Volumetric Clouds — a drifting cloudscape stacked in depth, lit by a low sun with god rays -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volumetric Clouds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{display:block;width:100vw;height:100vh;}
  .badge{position:fixed;left:16px;bottom:14px;z-index:9;font-family:'Inter',system-ui,sans-serif;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,230,215,.52);
    background:rgba(18,14,12,.32);border:1px solid rgba(255,210,170,.12);border-radius:999px;
    padding:6px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .4s,border-color .4s;}
  .badge:hover{color:rgba(255,245,235,.95);border-color:rgba(255,210,170,.32);}
  .badge a{color:inherit;text-decoration:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Volumetric Clouds&nbsp; ·&nbsp; <a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
  var canvas=document.getElementById('c');
  var gl=canvas.getContext('webgl',{antialias:true,alpha:false,powerPreference:'high-performance'});
  if(!gl){document.body.innerHTML='<p style="color:#fed;font-family:sans-serif;padding:2rem">WebGL not available.</p>';return;}
  var vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}';
  var fs=[
  'precision highp float;',
  'uniform vec2 u_resolution; uniform float u_time; uniform vec2 u_mouse;',
  'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}',
  'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);',
  ' float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));',
  ' return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}',
  'float fbm(vec2 p){float s=0.0,a=0.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);',
  ' for(int i=0;i<6;i++){s+=a*noise(p);p=m*p;a*=0.5;}return s;}',
  'void main(){',
  ' vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;',
  ' vec2 m=(u_mouse-0.5*u_resolution)/u_resolution.y;',
  ' float t=u_time;',
  ' vec3 sky=mix(vec3(0.95,0.60,0.40),vec3(0.10,0.18,0.40),smoothstep(-0.10,0.55,uv.y));',
  ' sky=mix(sky,vec3(0.03,0.06,0.16),smoothstep(0.30,0.90,uv.y));',
  ' vec2 sun=vec2(-0.25+m.x*0.4,0.15+m.y*0.2);',
  ' float sd=length((uv-sun)*vec2(1.0,1.5));',
  ' sky+=vec3(1.0,0.75,0.45)*exp(-sd*4.0)*1.4;',
  ' float dens=0.0,lit=0.0;',
  ' for(int i=0;i<6;i++){',
  '  float fi=float(i);',
  '  float scale=1.2+fi*0.9;',
  '  vec2 p=uv*scale*1.3+vec2(t*0.02*(1.0+fi*0.4),-fi*0.22-t*0.01);',
  '  float n=fbm(p+vec2(fbm(p*0.7)*0.8));',
  '  float d=smoothstep(0.42,0.85,n)*smoothstep(0.55,0.20,uv.y+0.05);',
  '  dens+=d*(1.0-fi*0.13);',
  '  float l=smoothstep(0.30,0.90,n)*exp(-length(uv-sun)*1.2);',
  '  lit+=l*(1.0-fi*0.13);',
  ' }',
  ' dens=clamp(dens*0.28,0.0,1.0);',
  ' lit=clamp(lit*0.20,0.0,1.0);',
  ' vec3 cloudCol=mix(vec3(0.35,0.33,0.42),vec3(1.0,0.80,0.60),lit);',
  ' vec3 col=mix(sky,cloudCol,dens);',
  ' vec2 dir=uv-sun;',
  ' float ang=atan(dir.y,dir.x);',
  ' float rays=0.5+0.5*sin(ang*14.0+fbm(uv*3.0)*3.0);',
  ' rays=pow(rays,3.0);',
  ' col+=vec3(1.0,0.75,0.50)*rays*exp(-length(dir)*0.8)*0.35;',
  ' col*=1.0-0.35*length(uv*vec2(0.5,0.8));',
  ' gl_FragColor=vec4(max(col,0.0),1.0);',
  '}'].join('\n');
  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));}return s;}
  var prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uRes=gl.getUniformLocation(prog,'u_resolution'),
      uTime=gl.getUniformLocation(prog,'u_time'),
      uMouse=gl.getUniformLocation(prog,'u_mouse');
  var mx=0.5,my=0.5,tmx=0.5,tmy=0.5;
  function move(x,y){tmx=x/window.innerWidth;tmy=1.0-y/window.innerHeight;}
  window.addEventListener('mousemove',function(e){move(e.clientX,e.clientY);});
  window.addEventListener('touchmove',function(e){if(e.touches[0])move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  var dpr=Math.min(window.devicePixelRatio||1,1.75);
  function resize(){var w=Math.floor(window.innerWidth*dpr),h=Math.floor(window.innerHeight*dpr);
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
  resize();window.addEventListener('resize',resize);
  var start=performance.now();
  function frame(now){
    mx+=(tmx-mx)*0.04;my+=(tmy-my)*0.04;
    gl.uniform2f(uRes,canvas.width,canvas.height);
    gl.uniform1f(uTime,(now-start)/1000);
    gl.uniform2f(uMouse,mx*canvas.width,my*canvas.height);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

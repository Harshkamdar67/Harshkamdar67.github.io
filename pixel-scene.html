<!-- Concept: Pixel City Day Cycle -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#05070d; }
  canvas{ display:block; width:100vw; height:100vh; image-rendering:pixelated; image-rendering:crisp-edges; }
  .badge{ position:fixed; left:14px; bottom:12px; z-index:20;
    font-family:'Share Tech Mono', monospace; font-size:11px; letter-spacing:.12em;
    color:rgba(180,220,255,.62); text-transform:uppercase;
    background:rgba(6,10,20,.5); border:1px solid rgba(140,190,255,.24);
    padding:6px 10px; border-radius:4px; backdrop-filter:blur(3px); user-select:none; }
  .badge a{ color:rgba(200,225,255,.95); text-decoration:none; }
  .badge a:hover{ text-shadow:0 0 8px rgba(150,200,255,.9); }
  .scan{ position:fixed; inset:0; z-index:6; pointer-events:none; opacity:.25;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.35) 2px 3px); mix-blend-mode:multiply; }
  .vig{ position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 46%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div>
<div class="vig"></div>
<div class="badge">Pixel Scene &nbsp;<a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const low = document.createElement('canvas');
  const lx = low.getContext('2d');
  let W,H, LW, LH, scale;

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  let buildings = [];
  let clouds = [];
  let stars = [];
  let cars = [];

  function buildWorld(){
    const rnd = mulberry32(1337);
    buildings = [];
    let x = 0;
    while(x < LW){
      const bw = 8 + Math.floor(rnd()*16);
      const bh = 18 + Math.floor(rnd()*58);
      buildings.push({
        x, w:bw, h:bh,
        col: 8 + Math.floor(rnd()*10),
        win: [], // [col,row]
        hue: rnd()
      });
      x += bw + Math.floor(rnd()*3);
    }
    // windows per building
    buildings.forEach(b=>{
      for(let wy=4; wy<b.h-4; wy+=5){
        for(let wx=2; wx<b.w-2; wx+=4){
          if(rnd() < 0.72) b.win.push([wx,wy, rnd()]);
        }
      }
    });
    clouds = [];
    for(let i=0;i<7;i++) clouds.push({x:rnd()*LW, y:6+rnd()*26, s:6+rnd()*14, v:0.06+rnd()*0.12});
    stars = [];
    for(let i=0;i<90;i++) stars.push({x:rnd()*LW, y:rnd()*(LH*0.5), t:rnd()*Math.PI*2});
    cars = [
      {x:0, v:0.9, y:0, dir:1, col:'#ffe08a'},
      {x:LW*0.6, v:0.55, y:1, dir:-1, col:'#8affd0'},
    ];
  }

  function size(){
    W = window.innerWidth; H = window.innerHeight;
    scale = Math.max(3, Math.round(Math.min(W,H)/230));
    LW = Math.ceil(W/scale); LH = Math.ceil(H/scale);
    low.width = LW; low.height = LH;
    cv.width = LW; cv.height = LH; // we scale via CSS to fill viewport, pixelated
    cv.style.width = W+'px'; cv.style.height = H+'px';
    lx.imageSmoothingEnabled = false;
    buildWorld();
  }
  size();
  window.addEventListener('resize', size);

  function lerp(a,b,t){ return a+(b-a)*t; }
  function lerpC(c1,c2,t){ return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))]; }
  function rgb(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }

  // palette keyframes across the day (0=dawn, .25=day, .5=dusk, .75=night, 1=dawn)
  const skyStops = [
    {t:0.00, top:[26,22,54],  bot:[240,140,90]},
    {t:0.18, top:[70,150,235],bot:[175,220,255]},
    {t:0.42, top:[60,120,220],bot:[250,200,150]},
    {t:0.55, top:[70,40,110], bot:[255,110,90]},
    {t:0.70, top:[12,14,40],  bot:[40,30,80]},
    {t:0.85, top:[6,8,26],    bot:[14,18,46]},
    {t:1.00, top:[26,22,54],  bot:[240,140,90]},
  ];
  function skyAt(t){
    for(let i=0;i<skyStops.length-1;i++){
      const a=skyStops[i], b=skyStops[i+1];
      if(t>=a.t && t<=b.t){
        const k=(t-a.t)/(b.t-a.t);
        return { top: lerpC(a.top,b.top,k), bot: lerpC(a.bot,b.bot,k) };
      }
    }
    return { top:skyStops[0].top, bot:skyStops[0].bot };
  }

  let t0 = performance.now();
  let speed = 1; // user can slow/speed time
  window.addEventListener('click', ()=>{ speed = speed===1?3:(speed===3?0.35:1); });

  function draw(now){
    const dayLen = 46000; // ms per full cycle
    const t = ((now - t0) / dayLen * speed) % 1;
    const sk = skyAt(t);
    const night = Math.max(0, Math.min(1, (t-0.62)/0.14)) * (t<0.95?1:Math.max(0,(1-(t-0.95)/0.05)));

    // sky gradient in bands
    const bands = 26;
    for(let i=0;i<bands;i++){
      const k = i/(bands-1);
      const c = lerpC(sk.top, sk.bot, k);
      lx.fillStyle = rgb(c);
      lx.fillRect(0, Math.floor(k*LH), LW, Math.ceil(LH/bands)+1);
    }

    // stars fade in at night
    lx.fillStyle = '#ffffff';
    stars.forEach(s=>{
      const a = night * (0.4+0.6*Math.abs(Math.sin(now*0.002 + s.t)));
      if(a>0.05){
        lx.globalAlpha = a;
        lx.fillRect(s.x|0, s.y|0, 1, 1);
      }
    });
    lx.globalAlpha = 1;

    // sun / moon on an arc
    const horizon = LH*0.72;
    const ang = Math.PI * (t*2); // full arc per cycle (half above horizon)
    const sx = LW*0.5 + Math.cos(Math.PI - ang) * LW*0.42;
    const sy = horizon - Math.sin(ang) * (LH*0.46);
    const isSun = t < 0.55;
    // sun visible dawn->dusk; moon at night
    if(isSun && t < 0.56){
      lx.fillStyle = '#fff3c0';
      lx.globalAlpha = 0.95;
      disk(sx, sy, 5);
      lx.globalAlpha = 0.25;
      disk(sx, sy, 8);
      lx.globalAlpha = 1;
    } else {
      lx.fillStyle = '#eef3ff';
      lx.globalAlpha = 0.9;
      disk(sx, sy, 4);
      lx.globalAlpha = 1;
    }

    function disk(x,y,r){
      for(let yy=-r; yy<=r; yy++){
        const w = Math.floor(Math.sqrt(r*r - yy*yy));
        lx.fillRect(Math.round(x-w), Math.round(y+yy), w*2+1, 1);
      }
    }

    // clouds
    lx.fillStyle = night>0.4 ? '#3a4160' : '#ffffff';
    lx.globalAlpha = night>0.4?0.5:0.75;
    clouds.forEach(c=>{
      c.x += c.v*(speed);
      if(c.x > LW+30) c.x = -30;
      const px = Math.round(c.x), py = Math.round(c.y);
      lx.fillRect(px, py, c.s, 2);
      lx.fillRect(px+3, py-2, c.s-6, 2);
      lx.fillRect(px+6, py-4, c.s-12, 2);
    });
    lx.globalAlpha = 1;

    // distant skyline (parallax, darker)
    lx.fillStyle = night>0.5 ? '#0a0e1e' : 'rgba(30,40,70,0.55)';
    buildings.forEach(b=>{
      const bx = b.x*0.6;
      const bh = b.h*0.6;
      lx.fillRect(Math.round(bx), Math.round(horizon-bh), Math.ceil(b.w), Math.ceil(bh));
    });

    // main buildings
    buildings.forEach(b=>{
      const bx = b.x, by = horizon - b.h;
      const base = 18 + b.col;
      lx.fillStyle = night>0.45
        ? 'rgb('+(base-6)+','+(base-4)+','+(base+12)+')'
        : 'rgb('+(base+30)+','+(base+34)+','+(base+50)+')';
      lx.fillRect(Math.round(bx), Math.round(by), b.w, b.h);
      // roof antenna
      if(b.h > 55){
        lx.fillRect(Math.round(bx+b.w/2), Math.round(by-4), 1, 4);
        lx.fillStyle = '#ff5a5a'; lx.globalAlpha = (0.5+0.5*Math.sin(now*0.005+b.h));
        lx.fillRect(Math.round(bx+b.w/2), Math.round(by-5), 1, 1);
        lx.globalAlpha = 1;
      }
      // windows
      b.win.forEach(w=>{
        const lit = night>0.35 ? (w[2] < 0.85 ? 1 : (Math.sin(now*0.001 + w[0]+w[1])>0 ? 1:0)) : (w[2]<0.12?1:0);
        if(lit){
          lx.fillStyle = night>0.35 ? (w[2]<0.6?'#ffd97a':'#9be7ff') : 'rgba(255,240,200,0.35)';
          lx.fillRect(Math.round(bx+w[0]), Math.round(by+w[1]), 2, 2);
        } else {
          lx.fillStyle = 'rgba(0,0,0,0.25)';
          lx.fillRect(Math.round(bx+w[0]), Math.round(by+w[1]), 2, 2);
        }
      });
    });

    // ground / road
    lx.fillStyle = night>0.45 ? '#07080f' : '#12182a';
    lx.fillRect(0, Math.round(horizon), LW, LH-horizon);
    lx.fillStyle = night>0.45 ? '#1b1f2e' : '#1c2438';
    lx.fillRect(0, Math.round(horizon)+Math.round((LH-horizon)*0.5), LW, LH);
    // road dashes
    lx.fillStyle = 'rgba(255,220,120,0.55)';
    const roadY = Math.round(horizon)+Math.round((LH-horizon)*0.55);
    for(let x=0;x<LW;x+=8){ lx.fillRect(x + (Math.floor(now*0.02)%8), roadY, 4, 1); }

    // cars
    cars.forEach(c=>{
      c.x += c.v*c.dir*(speed);
      if(c.dir>0 && c.x>LW+6) c.x=-6;
      if(c.dir<0 && c.x<-6) c.x=LW+6;
      const cy = c.dir>0 ? roadY-3 : roadY+3;
      lx.fillStyle = '#c9d4ff';
      lx.fillRect(Math.round(c.x), cy, 4, 2);
      lx.fillStyle = c.col;
      lx.fillRect(Math.round(c.x + (c.dir>0?4:-1)), cy+ (c.dir>0?0:0), 1, 1);
    });

    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,LW,LH);
    ctx.drawImage(low, 0, 0);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>

<!-- Concept: Kaleidoscope — polar-folded N-fold mirror symmetry over a swirling fBm + ring generative pattern -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaleidoscope</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:14px;bottom:14px;z-index:10;font:12px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color:rgba(255,255,255,.5);background:rgba(8,10,20,.34);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
padding:6px 11px;border:1px solid rgba(255,255,255,.12);border-radius:999px;letter-spacing:.02em;user-select:none}
.badge a{color:rgba(255,255,255,.78);text-decoration:none;margin-left:4px}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge"><span>Kaleidoscope</span> · <a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
  var c=document.getElementById('c');
  var gl=c.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});
  if(!gl){document.body.style.background='#000';return;}
  var vs="attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";
  var fs=[
"precision highp float;",
"uniform vec2 u_resolution; uniform float u_time; uniform vec2 u_mouse;",
"#define PI 3.14159265",
"float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
"float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);",
"  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}",
"float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.03;a*=0.5;}return v;}",
"void main(){",
"  vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;",
"  vec2 mo=(u_mouse-0.5)*0.7;",
"  uv+=mo;",
"  float r=length(uv);",
"  float a=atan(uv.y,uv.x);",
"  float N=8.0;",
"  a=mod(a,2.0*PI/N);",
"  a=abs(a-PI/N);",
"  float t=u_time*0.3;",
"  float g=fbm(vec2(a*7.0+t, r*5.0-t));",
"  float petal=0.5+0.5*sin(a*N-t*2.0+g*5.0);",
"  float bands=0.5+0.5*sin(r*14.0-t*3.0+g*6.0);",
"  vec3 c1=vec3(0.95,0.15,0.55); vec3 c2=vec3(0.10,0.75,1.0); vec3 c3=vec3(1.0,0.85,0.35);",
"  vec3 col=mix(c1,c2,g);",
"  col=mix(col,c3,petal*0.85);",
"  col*=0.4+1.0*r;",
"  col+=vec3(0.9,0.5,1.0)*pow(petal,3.0)*0.9;",
"  col+=vec3(1.0,0.95,0.85)*exp(-r*7.0)*1.0;",
"  col*=smoothstep(1.35,0.15,r);",
"  col=col/(1.0+col);",
"  col=pow(col,vec3(0.85));",
"  gl_FragColor=vec4(col,1.0);",
"}"].join("\n");
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));}return o;}
  var prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog);gl.useProgram(prog);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uRes=gl.getUniformLocation(prog,'u_resolution');
  var uTime=gl.getUniformLocation(prog,'u_time');
  var uMouse=gl.getUniformLocation(prog,'u_mouse');
  var mx=0.5,my=0.5,tmx=0.5,tmy=0.5;
  window.addEventListener('pointermove',function(e){tmx=e.clientX/window.innerWidth;tmy=1.0-e.clientY/window.innerHeight;},{passive:true});
  function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);
    var w=Math.max(1,Math.floor(window.innerWidth*dpr)),h=Math.max(1,Math.floor(window.innerHeight*dpr));
    if(c.width!==w||c.height!==h){c.width=w;c.height=h;}gl.viewport(0,0,c.width,c.height);}
  window.addEventListener('resize',resize);resize();
  var start=performance.now();
  function frame(){var t=(performance.now()-start)/1000;
    mx+=(tmx-mx)*0.05;my+=(tmy-my)*0.05;
    gl.uniform2f(uRes,c.width,c.height);gl.uniform1f(uTime,t);gl.uniform2f(uMouse,mx,my);
    gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!-- Particle Text — a word assembled from thousands of particles that scatter and reform -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<title>Particle Text</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#04060c;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:14px;bottom:14px;z-index:9;font:12px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:rgba(255,255,255,.5);background:rgba(8,10,20,.35);border:1px solid rgba(255,255,255,.1);
  padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);letter-spacing:.03em}
.badge a{color:rgba(180,200,255,.9);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Particle Text &middot; <a href="index.html">&larr; Gallery</a></div>
<script>
(()=>{
const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
const WORDS=['IMAGINE','CREATE','RESONATE','EMERGE'];
let wi=0;

const MAXP=9000;
const tx=new Float32Array(MAXP),ty=new Float32Array(MAXP);
const px=new Float32Array(MAXP),py=new Float32Array(MAXP);
const vx=new Float32Array(MAXP),vy=new Float32Array(MAXP);
const ox=new Float32Array(MAXP),oy=new Float32Array(MAXP);
const kk=new Float32Array(MAXP);
let N=0;

function sampleWord(word){
  const oc=document.createElement('canvas');
  const w=Math.floor(Math.min(W*0.92,1200)),h=Math.floor(Math.min(H*0.5,420));
  oc.width=w;oc.height=h;
  const g=oc.getContext('2d');
  let fs=h*0.78;
  g.font='700 '+fs+'px "Space Grotesk",system-ui,sans-serif';
  while(g.measureText(word).width>w*0.94&&fs>10){
    fs*=0.94;g.font='700 '+fs+'px "Space Grotesk",system-ui,sans-serif';
  }
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff';
  g.fillText(word,w/2,h/2);
  const data=g.getImageData(0,0,w,h).data;
  const step=Math.max(2,Math.round(Math.sqrt((w*h)/MAXP)));
  const pts=[];
  for(let y=0;y<h;y+=step){
    for(let x=0;x<w;x+=step){
      if(data[(y*w+x)*4+3]>128)pts.push([x-w/2,y-h/2]);
    }
  }
  return pts;
}

function assign(word,scatter){
  const pts=sampleWord(word);
  N=Math.min(pts.length,MAXP);
  // shuffle points
  for(let i=pts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=pts[i];pts[i]=pts[j];pts[j]=t;}
  const cx=W/2,cy=H/2;
  for(let i=0;i<N;i++){
    tx[i]=cx+pts[i][0];ty[i]=cy+pts[i][1];
    if(scatter){
      px[i]=cx+(Math.random()-0.5)*W*1.4;
      py[i]=cy+(Math.random()-0.5)*H*1.4;
      vx[i]=0;vy[i]=0;
    }
    ox[i]=0;oy[i]=0;
    kk[i]=Math.random();
  }
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#04060c';ctx.fillRect(0,0,W,H);
  assign(WORDS[wi],true);
}
addEventListener('resize',resize);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>resize());}
resize();

const mouse={x:-9999,y:-9999};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('pointerleave',()=>{mouse.x=-9999;mouse.y=-9999;});
addEventListener('pointerdown',e=>{
  for(let i=0;i<N;i++){
    const dx=px[i]-e.clientX,dy=py[i]-e.clientY,d2=dx*dx+dy*dy;
    if(d2<40000&&d2>1){const f=900/d2;vx[i]+=dx*f;vy[i]+=dy*f;}
  }
});
let morphTimer=0;
addEventListener('click',()=>{morphTimer=1;});

function frame(){
  ctx.fillStyle='rgba(4,6,12,0.28)';
  ctx.fillRect(0,0,W,H);
  morphTimer--;
  if(morphTimer===0){
    wi=(wi+1)%WORDS.length;
    assign(WORDS[wi],true);
    morphTimer=-1;
  }
  const MR=78,MR2=MR*MR;
  for(let i=0;i<N;i++){
    const dx=tx[i]-px[i],dy=ty[i]-py[i];
    vx[i]+=dx*0.030;vy[i]+=dy*0.030;
    const mx=px[i]-mouse.x,my=py[i]-mouse.y;
    const md2=mx*mx+my*my;
    if(md2<MR2&&md2>1){
      const d=Math.sqrt(md2);
      const f=(1-d/MR)*2.4;
      vx[i]+=mx/d*f;vy[i]+=my/d*f;
    }
    vx[i]*=0.84;vy[i]*=0.84;
    px[i]+=vx[i];py[i]+=vy[i];
  }
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<N;i++){
    const hue=205+Math.sin(kk[i]*6.283+performance.now()*0.0004)*60;
    const sp=Math.hypot(vx[i],vy[i]);
    const a=Math.min(0.6,0.12+sp*0.10);
    ctx.fillStyle='hsla('+hue+',92%,66%,'+a+')';
    ctx.fillRect(px[i]-1,py[i]-1,2.1,2.1);
  }
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>

<!-- Concept 57 · CSS Scene — a pure-CSS animated landscape of sun, mountains, sea and drifting clouds -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{overflow:hidden;font-family:"Cormorant Garamond",Georgia,serif;background:#0a1030}
  .sky{position:fixed;inset:0;overflow:hidden;
    background:linear-gradient(180deg,#0a1030 0%,#2a2a6e 28%,#7a3b78 48%,#e06b5c 62%,#ffb46b 72%,#ffd89b 80%,#3a4a7a 80.5%,#16223f 100%);
    transition:filter 1s ease}
  .sun{position:absolute;left:50%;top:66%;width:min(26vmin,220px);aspect-ratio:1;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 50%,#fff6d8,#ffd166 45%,#ff8c42 72%,rgba(255,140,66,0) 78%);
    box-shadow:0 0 120px 40px rgba(255,170,90,.55),0 0 240px 90px rgba(255,120,60,.35);
    animation:sunrise 14s ease-in-out infinite alternate}
  @keyframes sunrise{from{top:68%;filter:brightness(.95)}to{top:60%;filter:brightness(1.12)}}
  .glow{position:absolute;left:50%;top:78%;width:70vmax;height:70vmax;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,180,110,.35),transparent 60%);pointer-events:none}
  .cloud{position:absolute;background:rgba(255,240,235,.5);border-radius:50%;filter:blur(18px);
    mix-blend-mode:screen}
  .c1{width:44vmin;height:12vmin;top:14%;left:-30%;animation:drift 40s linear infinite}
  .c2{width:30vmin;height:9vmin;top:26%;left:-40%;animation:drift 58s linear infinite 6s;opacity:.7}
  .c3{width:54vmin;height:14vmin;top:6%;left:-60%;animation:drift 72s linear infinite 14s;opacity:.5}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(190vw)}}
  .range{position:absolute;bottom:20%;left:0;width:100%;height:44%}
  .mtn{position:absolute;bottom:0;width:0;height:0;border-style:solid;border-color:transparent;
    filter:drop-shadow(0 -6px 18px rgba(0,0,0,.35))}
  .m1{left:-4%;border-width:0 26vw 34vh 26vw;border-bottom-color:#1a2246}
  .m2{left:18%;border-width:0 32vw 42vh 32vw;border-bottom-color:#141a38}
  .m3{left:46%;border-width:0 30vw 36vh 30vw;border-bottom-color:#0e1330}
  .m4{left:72%;border-width:0 24vw 30vh 24vw;border-bottom-color:#171d40}
  .snow{position:absolute;bottom:0;width:0;height:0;border-style:solid;border-color:transparent}
  .s2{left:22%;border-width:0 7vw 9vh 7vw;border-bottom-color:#dfe7ff;opacity:.85}
  .s3{left:50%;border-width:0 6vw 7.5vh 6vw;border-bottom-color:#cfd8ff;opacity:.8}
  .sea{position:absolute;bottom:0;left:0;width:100%;height:20%;overflow:hidden;
    background:linear-gradient(180deg,#22305a,#0c1530 70%,#050a1c)}
  .sunpath{position:absolute;left:50%;bottom:0;width:14vmin;height:100%;transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(255,200,120,.7),transparent);
    filter:blur(8px);animation:shimmer 4s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.55;transform:translateX(-50%) scaleX(1)}50%{opacity:.9;transform:translateX(-50%) scaleX(1.3)}}
  .wave{position:absolute;left:-10%;width:120%;height:2px;background:linear-gradient(90deg,transparent,rgba(200,220,255,.5),transparent);
    border-radius:50%;animation:wv 6s linear infinite}
  .w1{bottom:14%;animation-delay:0s}
  .w2{bottom:9%;animation-delay:1.6s;opacity:.7}
  .w3{bottom:4%;animation-delay:3.2s;opacity:.5}
  @keyframes wv{from{transform:translateX(-14%) scaleY(1)}50%{transform:translateX(6%) scaleY(2.4)}to{transform:translateX(14%) scaleY(1)}}
  .stars{position:absolute;inset:0 0 60% 0;background-image:
    radial-gradient(1.4px 1.4px at 12% 22%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 38% 12%,#dfe7ff,transparent),
    radial-gradient(1.6px 1.6px at 66% 30%,#fff,transparent),
    radial-gradient(1.1px 1.1px at 84% 16%,#cfe0ff,transparent),
    radial-gradient(1.3px 1.3px at 52% 42%,#fff,transparent),
    radial-gradient(1px 1px at 22% 6%,#eef,transparent),
    radial-gradient(1.2px 1.2px at 92% 40%,#fff,transparent);
    animation:twinkle 5s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.7}50%{opacity:1}}
  .title{position:fixed;top:9%;left:50%;transform:translateX(-50%);text-align:center;z-index:6;pointer-events:none;
    color:#ffeede;text-shadow:0 2px 30px rgba(0,0,0,.5)}
  .title h1{font-weight:300;font-size:clamp(2rem,7vw,4.6rem);letter-spacing:.16em;text-transform:uppercase}
  .title p{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.6em;text-transform:uppercase;opacity:.75;margin-top:.4rem}
  .badge{position:fixed;bottom:1.1rem;left:1.1rem;z-index:20;font-family:"Space Mono",monospace;
    font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
    background:rgba(6,10,26,.5);border:1px solid rgba(255,255,255,.2);border-radius:999px;
    padding:.5rem .85rem;backdrop-filter:blur(8px);color:rgba(255,255,255,.75)}
  .badge a{color:#fff;text-decoration:none}
  .badge a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="sky" id="sky">
    <div class="stars"></div>
    <div class="glow"></div>
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="range">
      <div class="mtn m1"></div><div class="mtn m2"></div><div class="mtn m3"></div><div class="mtn m4"></div>
      <div class="snow s2"></div><div class="snow s3"></div>
    </div>
    <div class="sea">
      <div class="sunpath"></div>
      <div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div>
    </div>
  </div>
  <div class="title"><h1>Solstice</h1><p>a landscape in pure css</p></div>
  <div class="badge">CSS Scene &nbsp;·&nbsp; <a href="index.html">&larr; Gallery</a></div>
  <script>
    const sky=document.getElementById('sky');
    let t=0,target=0;
    addEventListener('pointermove',e=>{target=(e.clientX/innerWidth-.5);},{passive:true});
    (function loop(){
      t+=(target-t)*.05;
      sky.style.transform=`translateX(${t*-2}%)`;
      sky.style.filter=`hue-rotate(${t*12}deg)`;
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

<!-- svg-topographic — Animated Topographic Contour Terrain -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#050f0d;overflow:hidden}
  body{font-family:'IBM Plex Mono',monospace}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .badge{position:fixed;left:18px;bottom:18px;z-index:10;display:inline-flex;gap:10px;align-items:baseline;
    padding:7px 14px;border:1px solid rgba(140,220,180,.2);border-radius:999px;background:rgba(6,20,18,.5);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);color:rgba(198,236,220,.7);
    text-decoration:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;
    transition:opacity .4s,border-color .4s}
  .badge:hover{opacity:1;border-color:rgba(140,220,180,.55)}
  .badge .t{font-family:'Newsreader',serif;font-style:italic;font-size:16px;letter-spacing:.02em;text-transform:none;color:rgba(232,250,240,.95)}
  .badge .g{color:rgba(198,236,220,.45)}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Animated topographic contour terrain">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0b2320"/>
      <stop offset="55%" stop-color="#071714"/>
      <stop offset="100%" stop-color="#050f0d"/>
    </radialGradient>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="74%">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle id="hot" cx="800" cy="450" r="330" fill="url(#hot)"/>
  <g id="terrain" filter="url(#tglow)"></g>
  <g id="labels"></g>
  <rect width="1600" height="900" fill="url(#vig)"/>

  <text x="1500" y="92" text-anchor="end" fill="rgba(198,236,220,.5)" font-family="'Newsreader',serif" font-style="italic" font-size="30">Terrain Survey &#8470; 07</text>
  <text x="1500" y="118" text-anchor="end" fill="rgba(140,220,180,.42)" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="3">ELEVATION MODEL &#183; LIVE</text>
</svg>
<a class="badge" href="index.html"><span class="t">Topographic</span><span class="g">&larr; Gallery</span></a>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var svg=document.getElementById("stage");
  var terrain=document.getElementById("terrain"), labels=document.getElementById("labels");
  var W=1600,H=900, LINES=46, STEP=22;
  var top=80, bot=830, span=(bot-top)/(LINES-1);
  function lerp(a,b,t){return a+(b-a)*t;}
  function hex(c1,c2,t){
    return "rgb("+Math.round(lerp(c1[0],c2[0],t))+","+Math.round(lerp(c1[1],c2[1],t))+","+Math.round(lerp(c1[2],c2[2],t))+")";
  }
  var lowC=[18,86,74], midC=[46,150,110], highC=[214,238,168];
  var paths=[];
  for(var i=0;i<LINES;i++){
    var p=document.createElementNS(NS,"path");
    p.setAttribute("fill","none"); p.setAttribute("stroke-linejoin","round"); p.setAttribute("stroke-linecap","round");
    var t=i/(LINES-1);
    var col = t<0.6 ? hex(lowC,midC,t/0.6) : hex(midC,highC,(t-0.6)/0.4);
    var idx=(i%5===0);
    p.setAttribute("stroke",col);
    p.setAttribute("stroke-width", idx?1.7:1.0);
    p.setAttribute("opacity", idx?0.95:0.62);
    terrain.appendChild(p); paths.push(p);
    if(idx){
      var tx=document.createElementNS(NS,"text");
      tx.setAttribute("x","34"); tx.setAttribute("y",(top+i*span+4).toFixed(0));
      tx.setAttribute("fill","rgba(198,236,220,.45)"); tx.setAttribute("font-family","'IBM Plex Mono',monospace");
      tx.setAttribute("font-size","11");
      tx.textContent=((LINES-1-i)*25)+"m";
      labels.appendChild(tx);
    }
  }
  var mx=W/2,my=H/2,tx2=W/2,ty2=H/2,has=false;
  window.addEventListener("pointermove",function(e){
    var r=svg.getBoundingClientRect();
    tx2=(e.clientX-r.left)/r.width*W; ty2=(e.clientY-r.top)/r.height*H; has=true;
  },{passive:true});
  window.addEventListener("pointerleave",function(){has=false;});
  var hot=document.getElementById("hot");
  function noise(x,i,t){
    return 0.52*Math.sin(x*0.0055 + t*0.55 + i*0.34)
         + 0.30*Math.sin(x*0.0125 - t*0.34 + i*0.62)
         + 0.20*Math.sin(x*0.0235 + t*0.78 + i*0.18)
         + 0.12*Math.sin(x*0.0410 - t*0.5 + i*0.9);
  }
  function frame(now){
    mx+=(tx2-mx)*0.08; my+=(ty2-my)*0.08;
    var t=now/1000;
    hot.setAttribute("cx",mx.toFixed(1)); hot.setAttribute("cy",my.toFixed(1));
    for(var i=0;i<LINES;i++){
      var baseY=top+i*span;
      var amp=26+42*Math.exp(-Math.pow((i-(LINES-1)*0.55)/16,2));
      var d="";
      for(var x=-40;x<=W+40;x+=STEP){
        var y=baseY - amp*noise(x,i,t);
        var dx=x-mx, dy=baseY-my;
        var bump=110*Math.exp(-(dx*dx)/(2*210*210)) * Math.exp(-(dy*dy)/(2*250*250));
        y-=bump;
        d+=(x===-40?"M":" L")+x+","+y.toFixed(1);
      }
      paths[i].setAttribute("d",d);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

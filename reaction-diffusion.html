<!-- Reaction-Diffusion — a Gray-Scott system blooming into organic coral-like structures -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reaction Diffusion</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#03060a;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:14px;bottom:14px;z-index:9;font:12px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:rgba(255,255,255,.5);background:rgba(8,12,16,.35);border:1px solid rgba(255,255,255,.1);
  padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);letter-spacing:.03em}
.badge a{color:rgba(150,240,220,.9);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Reaction-Diffusion &middot; <a href="index.html">&larr; Gallery</a></div>
<script>
(()=>{
const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;

let GW=0,GH=0;
let u,v,un,vn,img,off,offctx;
const FEED=0.0545,KILL=0.062,DA=0.16,DB=0.08,STEPS=7;

function seedBlob(gx,gy,r){
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
    if(x*x+y*y>r*r)continue;
    const ix=((gx+x)%GW+GW)%GW,iy=((gy+y)%GH+GH)%GH;
    const i=iy*GW+ix;u[i]=1;v[i]=0.9;
  }
}

function init(){
  GW=280;GH=Math.max(60,Math.round(GW*H/W));
  const n=GW*GH;
  u=new Float32Array(n);v=new Float32Array(n);
  un=new Float32Array(n);vn=new Float32Array(n);
  u.fill(1);
  for(let k=0;k<14;k++)seedBlob((Math.random()*GW)|0,(Math.random()*GH)|0,4+((Math.random()*5)|0));
  off=document.createElement('canvas');off.width=GW;off.height=GH;
  offctx=off.getContext('2d');
  img=offctx.createImageData(GW,GH);
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#03060a';ctx.fillRect(0,0,W,H);
  init();
}
addEventListener('resize',resize);resize();

let dragging=false,mx=0,my=0;
addEventListener('pointerdown',e=>{dragging=true;mx=e.clientX;my=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
addEventListener('pointerleave',()=>dragging=false);

let frameN=0;
function frame(){
  for(let s=0;s<STEPS;s++){
    for(let yy=0;yy<GH;yy++){
      const row=yy*GW;
      const up=((yy-1+GH)%GH)*GW, dn=((yy+1)%GH)*GW;
      for(let xx=0;xx<GW;xx++){
        const i=row+xx;
        const xm=(xx-1+GW)%GW, xp=(xx+1)%GW;
        const uu=u[i],vv=v[i];
        const lu=u[up+xx]+u[dn+xx]+u[row+xm]+u[row+xp]-4*uu;
        const lv=v[up+xx]+v[dn+xx]+v[row+xm]+v[row+xp]-4*vv;
        const uvv=uu*vv*vv;
        un[i]=uu+DA*lu-uvv+FEED*(1-uu);
        vn[i]=vv+DB*lv+uvv-(KILL+FEED)*vv;
      }
    }
    let a=u;u=un;un=a;let b=v;v=vn;vn=b;
  }
  // periodic auto-seed to keep it alive
  if(++frameN%220===0)seedBlob((Math.random()*GW)|0,(Math.random()*GH)|0,5);
  if(dragging){
    const gx=Math.floor(mx/W*GW),gy=Math.floor(my/H*GH);
    seedBlob(gx,gy,6);
  }
  const d=img.data;
  for(let i=0,p=0;i<GW*GH;i++,p+=4){
    const t=Math.min(1,Math.max(0,(v[i]-0.09)*4.2));
    const tt=t*t;
    d[p]  = 4 + tt*235;
    d[p+1]= 18 + t*210 - tt*40;
    d[p+2]= 34 + t*150 + tt*120;
    d[p+3]=255;
  }
  offctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,W,H);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>

<!-- Concept 59 · CSS Orb — a glowing plasma energy sphere from layered radial gradients, blur and animation -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{background:#02040a;color:#dfe9ff;font-family:"Chakra Petch",system-ui,sans-serif;
    overflow:hidden;display:grid;place-items:center}
  .back{position:fixed;inset:0;background:
    radial-gradient(60% 60% at 50% 50%,rgba(30,80,200,.22),transparent 70%),
    radial-gradient(40% 40% at 20% 80%,rgba(180,40,200,.14),transparent 70%)}
  .orb{position:relative;width:min(62vmin,520px);aspect-ratio:1;border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%,#ffffff 0%,#9fd4ff 8%,transparent 26%),
      radial-gradient(circle at 50% 50%,#2aa4ff 0%,#0a4dff 34%,#5a1cff 58%,#1b0550 78%,#05010f 100%);
    box-shadow:
      0 0 60px 10px rgba(50,140,255,.55),
      0 0 160px 40px rgba(90,40,255,.45),
      inset -30px -40px 90px rgba(0,0,0,.75),
      inset 24px 30px 80px rgba(140,200,255,.4);
    animation:breathe 6s ease-in-out infinite;
    will-change:transform,box-shadow}
  .orb::before{content:"";position:absolute;inset:-14%;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(120,200,255,.55),rgba(150,60,255,.35),rgba(0,255,220,.45),rgba(120,200,255,.55));
    filter:blur(30px);mix-blend-mode:screen;animation:spin 14s linear infinite;z-index:-1}
  .plasma{position:absolute;inset:0;border-radius:50%;overflow:hidden;mix-blend-mode:screen;opacity:.9}
  .plasma i{position:absolute;border-radius:50%;filter:blur(16px);mix-blend-mode:screen}
  .plasma .x1{width:70%;height:70%;left:-10%;top:-6%;
    background:radial-gradient(circle,rgba(120,220,255,.9),transparent 62%);animation:swirl1 9s ease-in-out infinite alternate}
  .plasma .x2{width:64%;height:64%;right:-12%;top:14%;
    background:radial-gradient(circle,rgba(190,90,255,.85),transparent 62%);animation:swirl2 12s ease-in-out infinite alternate}
  .plasma .x3{width:66%;height:66%;left:14%;bottom:-14%;
    background:radial-gradient(circle,rgba(60,255,210,.7),transparent 62%);animation:swirl3 10s ease-in-out infinite alternate}
  @keyframes swirl1{from{transform:translate(-6%,-4%) scale(1)}to{transform:translate(28%,22%) scale(1.3)}}
  @keyframes swirl2{from{transform:translate(6%,6%) scale(1.2)}to{transform:translate(-24%,-14%) scale(.9)}}
  @keyframes swirl3{from{transform:translate(-8%,10%) scale(.95)}to{transform:translate(20%,-18%) scale(1.25)}}
  .spec{position:absolute;left:24%;top:16%;width:22%;height:14%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),transparent 70%);filter:blur(6px);mix-blend-mode:screen}
  .ring{position:absolute;width:min(84vmin,700px);aspect-ratio:1;border-radius:50%;
    border:1px solid rgba(120,200,255,.28);box-shadow:0 0 40px rgba(80,160,255,.28) inset;
    transform:rotateX(74deg);animation:spin 20s linear infinite}
  .ring.b{width:min(98vmin,820px);border-color:rgba(160,90,255,.22);animation-duration:28s;animation-direction:reverse}
  .particles{position:fixed;inset:0;pointer-events:none}
  .particles span{position:absolute;width:3px;height:3px;border-radius:50%;background:#bfe0ff;
    box-shadow:0 0 10px #7fb8ff;animation:rise linear infinite}
  @keyframes rise{from{transform:translateY(0) scale(1);opacity:0}
    20%{opacity:1}to{transform:translateY(-70vh) scale(.4);opacity:0}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{position:fixed;top:9%;left:50%;transform:translateX(-50%);text-align:center;z-index:8;pointer-events:none}
  .title h1{font-weight:600;font-size:clamp(1.5rem,5.4vw,3rem);letter-spacing:.44em;text-transform:uppercase;
    text-shadow:0 0 40px rgba(120,180,255,.7)}
  .title p{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.6em;text-transform:uppercase;opacity:.6;margin-top:.5rem}
  .badge{position:fixed;bottom:1.1rem;left:1.1rem;z-index:20;font-family:"Space Mono",monospace;
    font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
    background:rgba(6,10,22,.5);border:1px solid rgba(140,200,255,.24);border-radius:999px;
    padding:.5rem .85rem;backdrop-filter:blur(8px);color:rgba(220,235,255,.75)}
  .badge a{color:#fff;text-decoration:none}
  .badge a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="back"></div>
  <div class="ring"></div>
  <div class="ring b"></div>
  <div class="particles" id="parts"></div>
  <div class="orb" id="orb">
    <div class="plasma"><i class="x1"></i><i class="x2"></i><i class="x3"></i></div>
    <div class="spec"></div>
  </div>
  <div class="title"><h1>Reactor</h1><p>plasma containment</p></div>
  <div class="badge">CSS Orb &nbsp;·&nbsp; <a href="index.html">&larr; Gallery</a></div>
  <script>
    const parts=document.getElementById('parts');
    for(let i=0;i<34;i++){
      const s=document.createElement('span');
      s.style.left=(Math.random()*100)+'%';
      s.style.bottom=(-10+Math.random()*40)+'%';
      s.style.animationDuration=(6+Math.random()*10)+'s';
      s.style.animationDelay=(-Math.random()*12)+'s';
      const sc=.5+Math.random()*1.6; s.style.transform=`scale(${sc})`;
      parts.appendChild(s);
    }
    const orb=document.getElementById('orb');
    let tx=0,ty=0,cx=0,cy=0;
    addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);},{passive:true});
    (function loop(){
      cx+=(tx-cx)*.06; cy+=(ty-cy)*.06;
      orb.style.transform=`translate3d(${cx*24}px,${cy*24}px,0) scale(1)`;
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

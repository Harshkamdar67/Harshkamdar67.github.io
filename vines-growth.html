<!-- Vines Growth — curling stems reaching outward in real time as leaves unfurl -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vines Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #c{display:block;width:100vw;height:100vh;}
  .badge{position:fixed;left:16px;bottom:14px;z-index:9;font-family:'Inter',system-ui,sans-serif;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(215,240,205,.5);
    background:rgba(8,18,10,.32);border:1px solid rgba(150,230,150,.13);border-radius:999px;
    padding:6px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .4s,border-color .4s;}
  .badge:hover{color:rgba(235,255,225,.92);border-color:rgba(150,230,150,.32);}
  .badge a{color:inherit;text-decoration:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Vines Growth&nbsp; ·&nbsp; <a href="index.html">&larr; Gallery</a></div>
<script>
(function(){
  var canvas=document.getElementById('c');
  var ctx=canvas.getContext('2d');
  var W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);

  var segs=[], leaves=[], maxT=1;
  var state='grow', elapsed=0, treeFade=0, GROW=17;
  var mx=0.5,tmx=0.5, tt=0;

  function rnd(a,b){return a+Math.random()*(b-a);}

  function grow(x,y,ang,len,width,depth,t0){
    var n=6+Math.floor(Math.random()*4);
    var segLen=len/n, ca=ang, px=x, py=y;
    var curl=(Math.random()-0.5)*0.09;
    for(var i=0;i<n;i++){
      ca+=curl+Math.sin((t0+i)*0.5+depth)*0.10+rnd(-0.18,0.18);
      var nx=px+Math.cos(ca)*segLen, ny=py+Math.sin(ca)*segLen;
      var wid=width*(1-(i/n)*0.4);
      segs.push({x0:px,y0:py,x1:nx,y1:ny,t0:t0+i,dur:1.4,width:wid,depth:depth});
      // leaves at intervals along the stem
      if(i>0 && i<n-1 && Math.random()<0.45){
        leaves.push({x:nx,y:ny,ang:ca+(Math.random()<0.5?-1:1)*(0.9+Math.random()*0.5),
                     t0:t0+i+0.35,dur:0.9,size:rnd(10,20)*(1-depth*0.09),ph:Math.random()*6.28});
      }
      px=nx;py=ny;
      if(depth<4 && i>=2 && Math.random()<0.4){
        grow(px,py,ca+rnd(-0.9,0.9),len*rnd(0.5,0.75),width*0.66,depth+1,t0+i+rnd(0,0.5));
      }
    }
    leaves.push({x:px,y:py,ang:ca,t0:t0+n,dur:0.9,size:rnd(12,22),ph:Math.random()*6.28});
  }

  function buildTree(){
    segs=[];leaves=[];
    var roots=3+Math.floor(Math.random()*2);
    for(var r=0;r<roots;r++){
      var bx=W*(0.18+r*0.64/(roots-1))+rnd(-30,30);
      var ang=-Math.PI/2+rnd(-0.35,0.35);
      grow(bx,H*1.02,ang,H*0.20,9,0,0);
    }
    maxT=0.001;
    for(var i=0;i<segs.length;i++) maxT=Math.max(maxT,segs[i].t0+segs[i].dur);
    for(var j=0;j<leaves.length;j++) maxT=Math.max(maxT,leaves[j].t0+leaves[j].dur);
  }

  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildTree();state='grow';elapsed=0;treeFade=1;
  }
  window.addEventListener('mousemove',function(e){tmx=e.clientX/window.innerWidth;});
  window.addEventListener('touchmove',function(e){if(e.touches[0])tmx=e.touches[0].clientX/window.innerWidth;},{passive:true});

  function drawLeaf(lf,p,sway){
    var x=lf.x+sway, y=lf.y;
    var s=lf.size*p;
    ctx.save();ctx.translate(x,y);ctx.rotate(lf.ang);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(s*0.55,-s*0.55, s*1.35,-s*0.42, s*1.65,0);
    ctx.bezierCurveTo(s*1.35, s*0.42, s*0.55, s*0.55, 0,0);
    var lg=ctx.createLinearGradient(0,0,s*1.65,0);
    lg.addColorStop(0,'rgba(46,120,66,'+(0.9*treeFade)+')');
    lg.addColorStop(0.6,'rgba(120,225,130,'+(0.92*treeFade)+')');
    lg.addColorStop(1,'rgba(190,255,170,'+(0.9*treeFade)+')');
    ctx.fillStyle=lg;ctx.fill();
    ctx.strokeStyle='rgba(220,255,200,'+(0.25*treeFade)+')';
    ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*1.5,0);ctx.stroke();
    ctx.restore();
  }

  var last=performance.now();
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;tt+=dt;
    mx+=(tmx-mx)*0.05;
    elapsed+=dt;
    if(state==='grow'&&elapsed>GROW){state='fade';elapsed=0;}
    else if(state==='fade'){
      treeFade=Math.max(0,1-elapsed/1.8);
      if(elapsed>1.8){buildTree();state='grow';elapsed=0;treeFade=1;}
    } else if(state==='grow'){ treeFade=Math.min(1,treeFade+dt*0.8); }

    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#02060a');bg.addColorStop(0.55,'#05130f');bg.addColorStop(1,'#08170e');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    var g=Math.min(1.0, elapsed/GROW);
    var lean=(mx-0.5)*0.08;

    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.globalCompositeOperation='source-over';
    for(var i=0;i<segs.length;i++){
      var s=segs[i];
      var p=(g*maxT-s.t0)/s.dur;
      if(p<=0)continue;if(p>1)p=1;
      var sway=Math.sin(tt*0.6+s.y0*0.008+s.depth)*7*(1-Math.min(1,s.y0/H))+lean*40*(1-Math.min(1,s.y0/H));
      var x1=s.x0+(s.x1-s.x0)*p;
      var y1=s.y0+(s.y1-s.y0)*p;
      var dk=Math.min(1,s.depth/4);
      var r=Math.round(30+dk*70),gg=Math.round(90+dk*80),b=Math.round(45+dk*35);
      ctx.strokeStyle='rgba('+r+','+gg+','+b+','+(0.92*treeFade)+')';
      ctx.lineWidth=s.width*(0.4+0.6*p);
      ctx.beginPath();ctx.moveTo(s.x0+sway,s.y0);ctx.lineTo(x1+sway,y1);ctx.stroke();
    }
    // leaves
    for(var j=0;j<leaves.length;j++){
      var lf=leaves[j];
      var p2=(g*maxT-lf.t0)/lf.dur;
      if(p2<=0)continue;if(p2>1)p2=1;
      var sway2=Math.sin(tt*0.6+lf.y*0.008+lf.ph)*7*(1-Math.min(1,lf.y/H))+lean*40*(1-Math.min(1,lf.y/H));
      var ease=1-Math.pow(1-p2,3);
      drawLeaf(lf,ease,sway2);
    }
    // growing tips glow
    ctx.globalCompositeOperation='lighter';
    for(var k=0;k<segs.length;k++){
      var s2=segs[k];
      var p3=(g*maxT-s2.t0)/s2.dur;
      if(p3<=0||p3>0.995)continue;
      var xg=s2.x0+(s2.x1-s2.x0)*p3, yg=s2.y0+(s2.y1-s2.y0)*p3;
      var rg=ctx.createRadialGradient(xg,yg,0,xg,yg,10);
      rg.addColorStop(0,'rgba(190,255,180,'+(0.4*treeFade)+')');
      rg.addColorStop(1,'rgba(120,230,130,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(xg,yg,10,0,6.2832);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';

    var vg=ctx.createRadialGradient(W/2,H*0.55,H*0.3,W/2,H*0.55,H*1.0);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.58)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

    requestAnimationFrame(frame);
  }
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

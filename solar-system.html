<!-- Solar System - glowing sun, orbiting planets and additive fading motion trails -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar System</title>
<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden}
#c{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:18px;bottom:16px;z-index:5;font:11px/1.5 ui-monospace,Menlo,monospace;
letter-spacing:.16em;color:rgba(255,225,190,.55);text-transform:uppercase}
.badge a{color:rgba(255,190,120,.95);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Solar System &middot; <a href="index.html">&larr; Gallery</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x02030a);
var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,4000);
camera.position.set(0,48,95);
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;

scene.add(new THREE.AmbientLight(0x556688,0.85));
var sunLight=new THREE.PointLight(0xffd9a0,2.4,600); sunLight.position.set(0,0,0); scene.add(sunLight);

function glowTex(){
  var s=128,cv=document.createElement('canvas');cv.width=cv.height=s;
  var g=cv.getContext('2d');
  var gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.22,'rgba(255,236,180,0.85)');
  gr.addColorStop(0.5,'rgba(255,160,60,0.35)');
  gr.addColorStop(1,'rgba(255,120,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
var gtex=glowTex();

var sun=new THREE.Mesh(new THREE.SphereGeometry(3.2,48,48),
  new THREE.MeshBasicMaterial({color:0xfff0c0}));
scene.add(sun);
var sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:gtex,color:0xffd08a,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false}));
sunGlow.scale.set(30,30,1); scene.add(sunGlow);

var defs=[
  {r:0.5,d:7,c:0xa9b0c4,s:1.7,i:0.03},
  {r:0.8,d:11,c:0xe0b070,s:1.25,i:-0.05},
  {r:0.9,d:15,c:0x4f8ff0,s:1.0,i:0.02},
  {r:0.65,d:19,c:0xd05a3a,s:0.82,i:-0.04},
  {r:1.7,d:26,c:0xd8b48a,s:0.56,i:0.05},
  {r:1.35,d:33,c:0xe8d59a,s:0.44,i:-0.02,ring:true},
  {r:1.0,d:39,c:0x8fd8e0,s:0.34,i:0.04},
  {r:1.0,d:45,c:0x5a7ff0,s:0.28,i:-0.03}
];
var K=34, planets=[];
var orbitMat=new THREE.LineBasicMaterial({color:0x2a3a6a,transparent:true,opacity:0.55});
for(var i=0;i<defs.length;i++){
  var d=defs[i];
  var mesh=new THREE.Mesh(new THREE.SphereGeometry(d.r,32,32),
    new THREE.MeshStandardMaterial({color:d.c,emissive:d.c,emissiveIntensity:0.18,roughness:0.85,metalness:0.1}));
  scene.add(mesh);
  if(d.ring){
    var rg=new THREE.Mesh(new THREE.RingGeometry(d.r*1.5,d.r*2.4,72,1),
      new THREE.MeshBasicMaterial({color:0xd8c090,transparent:true,opacity:0.55,side:THREE.DoubleSide,depthWrite:false}));
    rg.rotation.x=Math.PI/2.1; mesh.add(rg);
  }
  var oPts=[],N=140;
  for(var o=0;o<=N;o++){var oa=o/N*Math.PI*2;oPts.push(new THREE.Vector3(Math.cos(oa)*d.d,0,Math.sin(oa)*d.d));}
  var og=new THREE.BufferGeometry().setFromPoints(oPts);
  scene.add(new THREE.Line(og,orbitMat));

  var tpos=new Float32Array(K*3), tcol=new Float32Array(K*3), base=new THREE.Color(d.c);
  var ang=i*1.7;
  var px=Math.cos(ang)*d.d, pz=Math.sin(ang)*d.d, py=Math.sin(ang)*d.d*d.i;
  for(var k=0;k<K;k++){
    tpos[k*3]=px;tpos[k*3+1]=py;tpos[k*3+2]=pz;
    var f=1-k/K; f*=f;
    tcol[k*3]=base.r*f;tcol[k*3+1]=base.g*f;tcol[k*3+2]=base.b*f;
  }
  var tg=new THREE.BufferGeometry();
  tg.setAttribute('position',new THREE.BufferAttribute(tpos,3));
  tg.setAttribute('color',new THREE.BufferAttribute(tcol,3));
  var trail=new THREE.Line(tg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(trail);
  planets.push({mesh:mesh,trail:trail,tpos:tpos,ang:ang,d:d,incl:d.i});
}

var sN=2400,sp=new Float32Array(sN*3);
for(var s=0;s<sN;s++){
  var th=Math.acos(2*Math.random()-1),ph=Math.random()*Math.PI*2,r=500+Math.random()*900;
  sp[s*3]=Math.sin(th)*Math.cos(ph)*r;sp[s*3+1]=Math.cos(th)*r;sp[s*3+2]=Math.sin(th)*Math.sin(ph)*r;
}
var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xcfe0ff,size:2,transparent:true,opacity:0.9,depthWrite:false})));

var mx=0,my=0,tx=0,ty=0;
addEventListener('mousemove',function(e){mx=(e.clientX/innerWidth-0.5)*2;my=(e.clientY/innerHeight-0.5)*2;});
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

var clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=clock.getElapsedTime();
  tx+=(mx-tx)*0.05; ty+=(my-ty)*0.05;

  sunGlow.scale.setScalar(30+Math.sin(t*2.0)*1.4);

  for(var i=0;i<planets.length;i++){
    var p=planets[i];
    p.ang+=p.d.s*dt;
    var x=Math.cos(p.ang)*p.d.d, z=Math.sin(p.ang)*p.d.d, y=Math.sin(p.ang)*p.d.d*p.incl;
    p.mesh.position.set(x,y,z);
    p.mesh.rotation.y+=dt*0.6;
    var tp=p.tpos;
    for(var k=K-1;k>0;k--){
      tp[k*3]=tp[(k-1)*3];tp[k*3+1]=tp[(k-1)*3+1];tp[k*3+2]=tp[(k-1)*3+2];
    }
    tp[0]=x;tp[1]=y;tp[2]=z;
    p.trail.geometry.attributes.position.needsUpdate=true;
  }

  var a=t*0.05+tx*0.7;
  var rad=100;
  camera.position.set(Math.sin(a)*rad,52-ty*18,Math.cos(a)*rad);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>

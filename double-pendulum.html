<!-- Concept 34: Double Pendulum — a chaotic double pendulum leaving a long-exposure glowing trace of its tip -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Pendulum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07050a}
  canvas{display:block;width:100vw;height:100vh}
  .badge{
    position:fixed;left:14px;bottom:14px;z-index:10;
    font:600 10px/1.3 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,235,215,.62);background:rgba(20,12,8,.42);
    border:1px solid rgba(255,180,110,.18);padding:7px 12px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:10px;align-items:center;pointer-events:none;white-space:nowrap;
  }
  .badge a{pointer-events:auto;color:rgba(255,190,120,.9);text-decoration:none;transition:color .2s}
  .badge a:hover{color:#fff}
  .badge .sep{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge"><span>Double Pendulum</span><span class="sep">/</span><a href="index.html">&larr; Gallery</a></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  let G = 9.81;              // scaled to the pixel arm length in build()
  const M1 = 1.0, M2 = 1.0;
  let L1 = 1, L2 = 1;
  let ox = 0, oy = 0;

  let s = [0, 0, 0, 0];      // th1, w1, th2, w2
  const trail = [];
  const TRAIL_MAX = 2400;

  function deriv(st) {
    const th1 = st[0], w1 = st[1], th2 = st[2], w2 = st[3];
    const d = th1 - th2;
    const den = 2 * M1 + M2 - M2 * Math.cos(2 * d);
    const a1 = (-G * (2 * M1 + M2) * Math.sin(th1)
      - M2 * G * Math.sin(th1 - 2 * th2)
      - 2 * Math.sin(d) * M2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(d)))
      / (L1 * den);
    const a2 = (2 * Math.sin(d) * (w1 * w1 * L1 * (M1 + M2)
      + G * (M1 + M2) * Math.cos(th1)
      + w2 * w2 * L2 * M2 * Math.cos(d)))
      / (L2 * den);
    return [w1, a1, w2, a2];
  }

  function rk4(st, dt) {
    const k1 = deriv(st);
    const s2 = st.map((v, i) => v + k1[i] * dt / 2);
    const k2 = deriv(s2);
    const s3 = st.map((v, i) => v + k2[i] * dt / 2);
    const k3 = deriv(s3);
    const s4 = st.map((v, i) => v + k3[i] * dt);
    const k4 = deriv(s4);
    return st.map((v, i) => v + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
  }

  function tips(st) {
    const x1 = ox + Math.sin(st[0]) * L1;
    const y1 = oy + Math.cos(st[0]) * L1;
    const x2 = x1 + Math.sin(st[2]) * L2;
    const y2 = y1 + Math.cos(st[2]) * L2;
    return { x1, y1, x2, y2 };
  }

  function randomize() {
    const a = Math.PI * (0.5 + Math.random() * 0.42);
    const b = Math.PI * (0.5 + Math.random() * 0.42);
    s = [a, 0, b, 0];
    trail.length = 0;
  }

  function build() {
    const L = Math.min(W, H) * 0.24;
    L1 = L; L2 = L;
    G = 9.81 * L;            // treat the arm length as 1 m -> ~2 s period
    ox = W * 0.5; oy = H * 0.30;
  }

  canvas.addEventListener('mousedown', randomize);
  canvas.addEventListener('touchstart', e => { randomize(); e.preventDefault(); }, { passive: false });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
    trail.length = 0;
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#07050a';
    ctx.fillRect(0, 0, W, H);

    const p = tips(s);
    trail.push({ x: p.x2, y: p.y2 });
    if (trail.length > TRAIL_MAX) trail.shift();

    // glowing long-exposure trace of the tip
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const L = trail.length;
    for (let i = 1; i < L; i++) {
      const a = trail[i - 1], b = trail[i];
      const f = i / L;                 // 0 = oldest, 1 = newest
      const alpha = Math.pow(f, 0.6) * 0.95;
      if (alpha < 0.015) continue;
      const hue = 8 + f * 52;          // deep red (old) -> gold (new)
      ctx.strokeStyle = 'hsla(' + hue + ',100%,' + (46 + f * 24) + '%,' + alpha + ')';
      ctx.lineWidth = 0.6 + f * 2.2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    // extra bloom on the freshest stretch of the trace
    for (let i = Math.max(1, Math.floor(L * 0.7)); i < L; i++) {
      const a = trail[i - 1], b = trail[i];
      const f = i / L;
      ctx.strokeStyle = 'hsla(' + (8 + f * 52) + ',100%,62%,' + (f * f * 0.16) + ')';
      ctx.lineWidth = 6 + f * 5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    // rods (drawn over the trace, dim)
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,205,165,0.34)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(ox, oy); ctx.lineTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2);
    ctx.stroke();

    // pivot + bobs
    ctx.globalCompositeOperation = 'lighter';
    const bob = (x, y, r, c1, c2) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.4);
      g.addColorStop(0, c1); g.addColorStop(0.35, c2); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 3.4, 0, 6.2832); ctx.fill();
      ctx.fillStyle = c1;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    };
    ctx.fillStyle = 'rgba(255,240,220,0.95)';
    ctx.beginPath(); ctx.arc(ox, oy, 3.4, 0, 6.2832); ctx.fill();
    bob(p.x1, p.y1, 6, 'rgba(255,225,190,0.98)', 'rgba(255,170,90,0.35)');
    bob(p.x2, p.y2, 7.5, 'rgba(255,255,240,1)', 'rgba(255,120,60,0.4)');
    ctx.globalCompositeOperation = 'source-over';
  }

  const FIXED = 1 / 480;
  let acc = 0, last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 24) { s = rk4(s, FIXED); acc -= FIXED; guard++; }
    if (guard >= 24) acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  s = [Math.PI * 0.6, 0, Math.PI * 0.6, 0];
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!-- Concept 40: Bubble Universe — drifting iridescent bubbles that collide, merge and grow -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#080418}
  canvas{display:block;width:100vw;height:100vh}
  .badge{
    position:fixed;left:14px;bottom:14px;z-index:10;
    font:600 10px/1.3 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(235,225,255,.66);background:rgba(16,10,32,.42);
    border:1px solid rgba(190,150,255,.2);padding:7px 12px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:10px;align-items:center;pointer-events:none;white-space:nowrap;
  }
  .badge a{pointer-events:auto;color:rgba(200,170,255,.92);text-decoration:none;transition:color .2s}
  .badge a:hover{color:#fff}
  .badge .sep{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge"><span>Bubble Universe</span><span class="sep">/</span><a href="index.html">&larr; Gallery</a></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const TARGET = 34;
  const BUOY = -14;          // gentle upward drift
  const DRAG = 0.995;
  const R_MIN = 12, R_MAX = 140;

  let bubbles = [];
  let t = 0;

  function makeBubble(x, y, r, vx, vy) {
    return {
      x, y, r,
      vx: vx !== undefined ? vx : (Math.random() - 0.5) * 26,
      vy: vy !== undefined ? vy : (Math.random() - 0.5) * 26 - 8,
      hue: Math.random() * 360,
      spin: (Math.random() - 0.5) * 0.6,
      phase: Math.random() * 6.28
    };
  }

  function spawnEdge() {
    const r = R_MIN + Math.random() * R_MIN * 1.6;
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -r - 10; }
    else if (side === 1) { x = Math.random() * W; y = H + r + 10; }
    else if (side === 2) { x = -r - 10; y = Math.random() * H; }
    else { x = W + r + 10; y = Math.random() * H; }
    bubbles.push(makeBubble(x, y, r));
  }

  function build() {
    bubbles = [];
    const n = Math.max(14, Math.min(TARGET, Math.round(W * H / 42000)));
    for (let i = 0; i < n; i++) {
      bubbles.push(makeBubble(
        Math.random() * W, Math.random() * H,
        R_MIN + Math.random() * R_MIN * 2.2));
    }
  }

  const mouse = { x: 0, y: 0, inside: false };
  function evt(e) { const t2 = e.touches ? e.touches[0] : e; return { x: t2.clientX, y: t2.clientY }; }
  canvas.addEventListener('mousemove', e => { const p = evt(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true; });
  canvas.addEventListener('mouseleave', () => mouse.inside = false);
  function burst(e) {
    const p = evt(e);
    for (let i = 0; i < 6; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = R_MIN * (0.6 + Math.random() * 0.9);
      bubbles.push(makeBubble(p.x, p.y, r,
        Math.cos(ang) * (60 + Math.random() * 90),
        Math.sin(ang) * (60 + Math.random() * 90)));
    }
    e.preventDefault();
  }
  canvas.addEventListener('mousedown', burst);
  canvas.addEventListener('touchstart', burst, { passive: false });

  function step(dt) {
    t += dt;
    // integrate
    for (const b of bubbles) {
      b.vy += BUOY * dt;
      // curl-ish wander
      b.vx += Math.sin(t * 0.7 + b.phase) * 5 * dt;
      b.vy += Math.cos(t * 0.6 + b.phase * 1.3) * 5 * dt;
      if (mouse.inside) {
        const dx = b.x - mouse.x, dy = b.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 200 * 200) {
          const d = Math.sqrt(d2) || 1;
          const f = (1 - d / 200) * 40;
          b.vx += (dx / d) * f * dt;
          b.vy += (dy / d) * f * dt;
        }
      }
      b.vx *= DRAG; b.vy *= DRAG;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.hue += b.spin * dt * 30;
      // walls (soft bounce)
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.6; }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.6; }
      if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.6; }
      if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.6; }
    }

    // collisions + merging
    for (let i = 0; i < bubbles.length; i++) {
      const a = bubbles[i];
      if (!a) continue;
      for (let j = i + 1; j < bubbles.length; j++) {
        const b = bubbles[j];
        if (!b) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        const sum = a.r + b.r;
        if (d === 0) { d = 0.01; dx = 0.01; }
        if (d < sum) {
          const overlap = sum - d;
          // merge if one is substantially bigger, or deeply overlapping
          const ratio = Math.min(a.r, b.r) / Math.max(a.r, b.r);
          if (overlap > 0.28 * Math.min(a.r, b.r) || (ratio < 0.55 && overlap > 4)) {
            const big = a.r >= b.r ? a : b;
            const small = a.r >= b.r ? b : a;
            const newR = Math.sqrt(big.r * big.r + small.r * small.r);
            if (newR < R_MAX) {
              const mA = big.r * big.r, mB = small.r * small.r, mT = mA + mB;
              big.x = (big.x * mA + small.x * mB) / mT;
              big.y = (big.y * mA + small.y * mB) / mT;
              big.vx = (big.vx * mA + small.vx * mB) / mT;
              big.vy = (big.vy * mA + small.vy * mB) / mT;
              big.r = newR;
              big.hue = (big.hue + small.hue) * 0.5;
              // remove small
              if (small === a) { bubbles[i] = null; }
              else { bubbles[j] = null; }
              if (bubbles[i] === null) break;
              continue;
            }
          }
          // elastic push apart
          const nx = dx / d, ny = dy / d;
          const push = overlap * 0.5;
          const invA = 1 / (a.r * a.r), invB = 1 / (b.r * b.r);
          const tot = invA + invB;
          a.x -= nx * push * (invA / tot); a.y -= ny * push * (invA / tot);
          b.x += nx * push * (invB / tot); b.y += ny * push * (invB / tot);
          // impulse along normal
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const e = 0.85;
            const imp = -(1 + e) * vn / tot;
            a.vx -= imp * nx * invA; a.vy -= imp * ny * invA;
            b.vx += imp * nx * invB; b.vy += imp * ny * invB;
          }
        }
      }
    }
    bubbles = bubbles.filter(Boolean);

    // repopulate
    let tries = 0;
    while (bubbles.length < Math.max(14, Math.min(TARGET, Math.round(W * H / 42000))) && tries < 3) {
      spawnEdge(); tries++;
    }
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(8,4,24,0.32)';
    ctx.fillRect(0, 0, W, H);

    // nebula wash
    ctx.globalCompositeOperation = 'lighter';
    const ng = ctx.createRadialGradient(W * 0.3, H * 0.35, 0, W * 0.3, H * 0.35, Math.max(W, H) * 0.7);
    ng.addColorStop(0, 'rgba(90,40,160,0.10)');
    ng.addColorStop(1, 'rgba(90,40,160,0)');
    ctx.fillStyle = ng; ctx.fillRect(0, 0, W, H);

    for (const b of bubbles) {
      const h = b.hue;
      // soft outer glow
      const og = ctx.createRadialGradient(b.x, b.y, b.r * 0.6, b.x, b.y, b.r * 1.5);
      og.addColorStop(0, 'hsla(' + h + ',90%,70%,0.16)');
      og.addColorStop(1, 'hsla(' + (h + 60) + ',90%,70%,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, 6.2832); ctx.fill();

      // body: translucent iridescent film
      ctx.globalCompositeOperation = 'source-over';
      const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.05, b.x, b.y, b.r);
      g.addColorStop(0.0, 'hsla(' + h + ',95%,92%,0.10)');
      g.addColorStop(0.55, 'hsla(' + (h + 70) + ',90%,78%,0.05)');
      g.addColorStop(0.86, 'hsla(' + (h + 150) + ',95%,72%,0.20)');
      g.addColorStop(1.0, 'hsla(' + (h + 210) + ',95%,80%,0.02)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();

      // iridescent rim
      ctx.globalCompositeOperation = 'lighter';
      const segs = 26;
      for (let s = 0; s < segs; s++) {
        const a0 = s / segs * Math.PI * 2 + t * 0.3;
        const a1 = (s + 1) / segs * Math.PI * 2 + t * 0.3;
        const hh = (h + s / segs * 360 + t * 40) % 360;
        ctx.strokeStyle = 'hsla(' + hh + ',100%,' + (68 + 16 * Math.sin(a0 + t)) + '%,0.55)';
        ctx.lineWidth = Math.max(1.2, b.r * 0.035);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r - ctx.lineWidth * 0.5, a0, a1);
        ctx.stroke();
      }

      // specular highlight
      const hx = b.x - b.r * 0.38, hy = b.y - b.r * 0.42;
      const sg = ctx.createRadialGradient(hx, hy, 0, hx, hy, b.r * 0.7);
      sg.addColorStop(0, 'rgba(255,255,255,0.75)');
      sg.addColorStop(0.25, 'rgba(255,255,255,0.18)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(hx, hy, b.r * 0.7, 0, 6.2832); ctx.fill();

      // small counter-highlight
      const cx2 = b.x + b.r * 0.34, cy2 = b.y + b.r * 0.4;
      const cg = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, b.r * 0.4);
      cg.addColorStop(0, 'hsla(' + (h + 200) + ',100%,85%,0.30)');
      cg.addColorStop(1, 'hsla(' + (h + 200) + ',100%,85%,0)');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(cx2, cy2, b.r * 0.4, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(8,4,24,1)'; ctx.fillRect(0, 0, W, H);
    build();
  }

  const FIXED = 1 / 120;
  let acc = 0, last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 8) { step(FIXED); acc -= FIXED; guard++; }
    if (guard >= 8) acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

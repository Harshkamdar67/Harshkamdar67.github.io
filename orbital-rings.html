<!-- CONCEPT: Orbital Rings — concentric rings with bodies sweeping on trails, live telemetry readouts per orbit -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05080f}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #badge{position:fixed;left:16px;bottom:14px;z-index:10;font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.14em;color:rgba(150,190,240,.55);text-transform:uppercase;
    display:flex;gap:10px;align-items:center}
  #badge a{color:rgba(150,190,240,.55);text-decoration:none;border-bottom:1px solid rgba(150,190,240,.22)}
  #badge a:hover{color:#7fd4ff}
  #badge .dot{width:4px;height:4px;border-radius:50%;background:#4fb0ff;box-shadow:0 0 8px #4fb0ff}
  #panel{position:fixed;right:20px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center;
    gap:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(180,210,250,.75);pointer-events:none}
  .row{display:grid;grid-template-columns:auto auto auto;gap:12px;align-items:center;
    padding:4px 10px;border-left:2px solid rgba(120,170,230,.25)}
  .row .nm{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.04em}
  .row .r{color:rgba(255,170,90,.9)}
  .row .v{color:rgba(140,220,255,.9);min-width:64px;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<div id="badge"><span class="dot"></span><span>Orbital Rings</span><span>&middot;</span><a href="index.html">&larr; Gallery</a></div>
<script>
(()=>{
  const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
  let W,H,DPR,cx,cy,baseR;
  const TAU=Math.PI*2;
  const bodies=[];
  const NAMES=['KEPLER','VESTA','ORION','LYRA','HELIOS','NOVA','ATLAS','ZEPHYR'];
  const N=8;

  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cvs.width=Math.floor(W*DPR);cvs.height=Math.floor(H*DPR);
    cvs.style.width=W+'px';cvs.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W*0.44;cy=H/2;baseR=Math.min(W*0.42,H*0.46);
  }

  function init(){
    bodies.length=0;
    for(let i=0;i<N;i++){
      const frac=0.22+i*0.10;             // radius fraction
      bodies.push({
        name:NAMES[i%NAMES.length],
        rf:frac,
        r:baseR*frac,
        a:Math.random()*TAU,
        // Kepler-ish: outer slower
        speed:(0.55/Math.pow(frac,1.35)) * (Math.random()<0.5?1:-1),
        hue: i%2? 32 : 202,                // alternate amber / cyan
        size: 2.6 + i*0.5,
        trail: []
      });
    }
    buildPanel();
  }

  let hover=-1;
  let t=0;
  function loop(){
    t+=0.016;
    // motion blur trail
    ctx.fillStyle='rgba(5,8,15,0.30)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';

    // core glow
    const core=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*0.4);
    core.addColorStop(0,'rgba(120,200,255,0.35)');
    core.addColorStop(0.4,'rgba(70,130,220,0.10)');
    core.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,baseR*0.4,0,TAU);ctx.fill();
    // central star
    ctx.fillStyle='rgba(220,240,255,0.95)';
    ctx.beginPath();ctx.arc(cx,cy,3.4+Math.sin(t*3)*0.8,0,TAU);ctx.fill();

    // rings
    for(let i=0;i<bodies.length;i++){
      const b=bodies[i];
      const rr=baseR*b.rf;
      const isHover=(i===hover);
      ctx.strokeStyle=isHover? `hsla(${b.hue},95%,70%,0.42)` : 'rgba(120,160,220,0.10)';
      ctx.lineWidth=isHover?1.4:0.8;
      ctx.beginPath();ctx.arc(cx,cy,rr,0,TAU);ctx.stroke();
      // tick marks
      for(let k=0;k<48;k++){
        const a=k/48*TAU;
        const x1=cx+Math.cos(a)*rr, y1=cy+Math.sin(a)*rr;
        const x2=cx+Math.cos(a)*(rr+(k%12===0?6:3)), y2=cy+Math.sin(a)*(rr+(k%12===0?6:3));
        ctx.strokeStyle=`rgba(140,180,240,${k%12===0?0.22:0.08})`;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      }
    }

    // bodies + trails
    for(let i=0;i<bodies.length;i++){
      const b=bodies[i];
      b.a += b.speed*0.012;
      const rr=baseR*b.rf;
      const x=cx+Math.cos(b.a)*rr, y=cy+Math.sin(b.a)*rr;
      b.trail.push({x,y});
      if(b.trail.length>60)b.trail.shift();

      // trail stroke
      for(let k=1;k<b.trail.length;k++){
        const p0=b.trail[k-1],p1=b.trail[k];
        const al=(k/b.trail.length)*0.5;
        ctx.strokeStyle=`hsla(${b.hue},95%,64%,${al})`;
        ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
      }
      // body
      const glow=ctx.createRadialGradient(x,y,0,x,y,b.size*5);
      glow.addColorStop(0,`hsla(${b.hue},100%,80%,0.9)`);
      glow.addColorStop(1,`hsla(${b.hue},100%,60%,0)`);
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,b.size*5,0,TAU);ctx.fill();
      ctx.fillStyle=`hsl(${b.hue},100%,88%)`;
      ctx.beginPath();ctx.arc(x,y,b.size,0,TAU);ctx.fill();
      b._x=x;b._y=y;
    }
    ctx.globalCompositeOperation='source-over';

    // crosshair sweep line
    const sweep=(t*0.6)%TAU;
    ctx.strokeStyle='rgba(120,200,255,0.12)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(sweep)*baseR*1.05, cy+Math.sin(sweep)*baseR*1.05);ctx.stroke();

    updatePanel();
    requestAnimationFrame(loop);
  }

  const panel=document.getElementById('panel');
  let rows=[];
  function buildPanel(){
    panel.innerHTML='';
    rows=bodies.map(b=>{
      const d=document.createElement('div');d.className='row';
      d.innerHTML=`<span class="nm">${b.name}</span><span class="r"></span><span class="v"></span>`;
      panel.appendChild(d);return d;
    });
  }
  function updatePanel(){
    for(let i=0;i<bodies.length;i++){
      const b=bodies[i], d=rows[i];
      d.children[1].textContent=(b.rf*baseR/ (baseR/100)).toFixed(0)+'u';
      d.children[2].textContent=(Math.abs(b.speed)*0.9).toFixed(2)+' rev/s';
      d.style.borderLeftColor = i===hover? `hsla(${b.hue},90%,60%,0.9)` : 'rgba(120,170,230,0.25)';
      d.style.opacity = hover===-1?0.75 : (i===hover?1:0.35);
    }
  }

  // hover detection on rings
  window.addEventListener('pointermove',e=>{
    const mx=e.clientX,my=e.clientY;
    const d=Math.hypot(mx-cx,my-cy);
    hover=-1;let best=1e9;
    for(let i=0;i<bodies.length;i++){
      const rr=baseR*bodies[i].rf;
      const diff=Math.abs(d-rr);
      if(diff<18 && diff<best){best=diff;hover=i;}
    }
  });
  addEventListener('resize',()=>{resize();init();});
  resize();init();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

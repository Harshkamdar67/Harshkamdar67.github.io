<!-- Low-Poly Island - floating flat-shaded island, shader water, day/night cycle -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low-Poly Island</title>
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden}
#c{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:18px;bottom:16px;z-index:5;font:11px/1.5 ui-monospace,Menlo,monospace;
letter-spacing:.16em;color:rgba(200,215,255,.5);text-transform:uppercase}
.badge a{color:rgba(150,200,255,.85);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Low-Poly Island &middot; <a href="index.html">&larr; Gallery</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a1424);
scene.fog=new THREE.FogExp2(0x0a1424,0.0032);
var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,2500);
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;

var hemi=new THREE.HemisphereLight(0x9fc0ff,0x1b2416,0.6); scene.add(hemi);
var ambient=new THREE.AmbientLight(0x334466,0.5); scene.add(ambient);
var sun=new THREE.DirectionalLight(0xfff0d0,1.4); sun.position.set(40,60,20); scene.add(sun);

var world=new THREE.Group(); scene.add(world);

function noiseH(x,z){
  return Math.sin(x*0.55)*Math.cos(z*0.5)*1.7
       + Math.sin(x*1.25+1.3)*Math.cos(z*1.05-0.4)*0.8
       + Math.sin((x+z)*0.3)*1.4
       + Math.cos(x*0.22-z*0.27)*1.1;
}
function terrainHeight(x,z){
  var d=Math.sqrt(x*x+z*z)/11;
  var h=noiseH(x,z)*(1-d*0.35)+1.2;
  return h-Math.pow(d,3)*2.4;
}
var R=11,RINGS=18,SEG=64;
var verts=[[0,0]];
for(var ri=1;ri<=RINGS;ri++){
  var rr=R*Math.pow(ri/RINGS,0.85);
  for(var si=0;si<SEG;si++){var a=si/SEG*Math.PI*2;verts.push([Math.cos(a)*rr,Math.sin(a)*rr]);}
}
var idx=[];
for(var j=0;j<SEG;j++){idx.push(0,1+j,1+((j+1)%SEG));}
for(var r2=0;r2<RINGS-1;r2++){
  var base=1+r2*SEG,next=1+(r2+1)*SEG;
  for(var k=0;k<SEG;k++){
    var k2=(k+1)%SEG;
    idx.push(base+k,next+k,base+k2);
    idx.push(base+k2,next+k,next+k2);
  }
}
var tp=new Float32Array(verts.length*3);
for(var vi=0;vi<verts.length;vi++){
  var x=verts[vi][0],z=verts[vi][1];
  tp[vi*3]=x;tp[vi*3+1]=terrainHeight(x,z);tp[vi*3+2]=z;
}
var tgeo=new THREE.BufferGeometry();
tgeo.setAttribute('position',new THREE.BufferAttribute(tp,3));
tgeo.setIndex(idx);tgeo.computeVertexNormals();
var terrain=new THREE.Mesh(tgeo,new THREE.MeshStandardMaterial({color:0x527f3c,flatShading:true,roughness:0.95,metalness:0,side:THREE.DoubleSide}));
world.add(terrain);

var rockGeo=new THREE.CylinderGeometry(R*0.98,0.4,16,14,5,true);
var rp=rockGeo.attributes.position;
for(var q=0;q<rp.count;q++){
  var px=rp.getX(q),py=rp.getY(q),pz=rp.getZ(q);
  var n=Math.sin(px*0.6)*Math.cos(pz*0.6)*0.9+Math.sin(py*0.4)*0.6;
  rp.setXYZ(q,px*(1+n*0.12),py-n*0.5,pz*(1+n*0.12));
}
rockGeo.computeVertexNormals();
var rock=new THREE.Mesh(rockGeo,new THREE.MeshStandardMaterial({color:0x6b5a4a,flatShading:true,roughness:1,metalness:0,side:THREE.DoubleSide}));
rock.position.y=-8; world.add(rock);

var trunkMat=new THREE.MeshStandardMaterial({color:0x5a3d2b,flatShading:true,roughness:1});
var leafMat=new THREE.MeshStandardMaterial({color:0x2f8d3f,flatShading:true,roughness:1});
var trunkGeo=new THREE.CylinderGeometry(0.14,0.2,1.1,5);
var coneGeo=[new THREE.ConeGeometry(1.1,1.3,6),new THREE.ConeGeometry(0.82,1.3,6),new THREE.ConeGeometry(0.54,1.3,6)];
function addTree(x,z,scale){
  var g=new THREE.Group();
  var tr=new THREE.Mesh(trunkGeo,trunkMat);tr.position.y=0.55;g.add(tr);
  for(var i2=0;i2<3;i2++){var c=new THREE.Mesh(coneGeo[i2],leafMat);c.position.y=1.35+i2*0.8;g.add(c);}
  g.position.set(x,terrainHeight(x,z)-0.2,z);
  g.scale.setScalar(scale);
  g.rotation.y=Math.random()*Math.PI*2;
  world.add(g);
}
var placed=0;
while(placed<34){
  var ang=Math.random()*Math.PI*2, rad=Math.random()*R*0.72;
  var tx2=Math.cos(ang)*rad, tz2=Math.sin(ang)*rad;
  if(terrainHeight(tx2,tz2)>0.6){addTree(tx2,tz2,0.7+Math.random()*0.7);placed++;}
}
var rockMatSmall=new THREE.MeshStandardMaterial({color:0x8a8577,flatShading:true,roughness:1});
for(var rc=0;rc<12;rc++){
  var a3=Math.random()*Math.PI*2, rr3=Math.random()*R*0.9;
  var rx=Math.cos(a3)*rr3, rz=Math.sin(a3)*rr3;
  var m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.4+Math.random()*0.6,0),rockMatSmall);
  m.position.set(rx,terrainHeight(rx,rz)+0.1,rz);
  m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  m.scale.y=0.7; world.add(m);
}

function cloudTex(){
  var s=128,cv=document.createElement('canvas');cv.width=cv.height=s;
  var g=cv.getContext('2d');
  var gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,0.9)');
  gr.addColorStop(0.4,'rgba(255,255,255,0.45)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
var ctex=cloudTex(),clouds=[];
for(var ci=0;ci<16;ci++){
  var sm=new THREE.SpriteMaterial({map:ctex,transparent:true,opacity:0.5,depthWrite:false,color:0xdfe8ff});
  var sp=new THREE.Sprite(sm);
  var cang=Math.random()*Math.PI*2,crad=16+Math.random()*24;
  sp.position.set(Math.cos(cang)*crad,5+Math.random()*16,Math.sin(cang)*crad);
  var sc=6+Math.random()*11;
  sp.scale.set(sc,sc*0.55,1);
  sp.userData={ang:cang,rad:crad,sp:0.02+Math.random()*0.05};
  scene.add(sp);clouds.push(sp);
}

var waterMat=new THREE.ShaderMaterial({
  transparent:true,
  uniforms:{uTime:{value:0},uA:{value:new THREE.Color(0x08243f)},uB:{value:new THREE.Color(0x2b86c9)}},
  vertexShader:'uniform float uTime;varying float vW;void main(){vec3 p=position;float w=sin(p.x*0.08+uTime*0.9)*0.9+cos(p.y*0.07+uTime*0.7)*0.8;p.z+=w;vW=w;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}',
  fragmentShader:'uniform vec3 uA;uniform vec3 uB;varying float vW;void main(){float m=smoothstep(-1.6,1.6,vW);vec3 c=mix(uA,uB,m*0.85);gl_FragColor=vec4(c,0.94);}'
});
var water=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400,80,80),waterMat);
water.rotation.x=-Math.PI/2; water.position.y=-44; scene.add(water);

var sN=1600,spos=new Float32Array(sN*3);
for(var s2=0;s2<sN;s2++){
  var th=Math.acos(2*Math.random()-1), ph=Math.random()*Math.PI*2, sr=420+Math.random()*380;
  spos[s2*3]=Math.sin(th)*Math.cos(ph)*sr;
  spos[s2*3+1]=Math.abs(Math.cos(th))*sr*0.9+40;
  spos[s2*3+2]=Math.sin(th)*Math.sin(ph)*sr;
}
var sgeo=new THREE.BufferGeometry();sgeo.setAttribute('position',new THREE.BufferAttribute(spos,3));
var stars=new THREE.Points(sgeo,new THREE.PointsMaterial({color:0xffffff,size:1.6,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(stars);

var mx=0,my=0,tx=0,ty=0;
addEventListener('mousemove',function(e){mx=(e.clientX/innerWidth-0.5)*2;my=(e.clientY/innerHeight-0.5)*2;});
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

var dayCol=new THREE.Color(0x14304f), nightCol=new THREE.Color(0x04060d);
var skyNow=new THREE.Color(), sunSet=new THREE.Color(0xff7a3c), sunDay=new THREE.Color(0xfff0d0);
var clock=new THREE.Clock(), cycle=0.6;
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=clock.getElapsedTime();
  cycle+=dt*0.09;
  tx+=(mx-tx)*0.05; ty+=(my-ty)*0.05;

  var dayF=(Math.sin(cycle)+1)*0.5;
  skyNow.copy(nightCol).lerp(dayCol,dayF);
  scene.background.copy(skyNow);
  scene.fog.color.copy(skyNow);
  hemi.intensity=0.25+dayF*0.7;
  ambient.intensity=0.25+dayF*0.4;
  sun.intensity=0.15+dayF*1.6;
  var ang2=cycle;
  sun.position.set(Math.cos(ang2)*80,Math.max(Math.sin(ang2)*90,4),Math.sin(ang2*0.6)*40+20);
  var low=1-Math.min(1,Math.max(0,Math.sin(ang2)));
  sun.color.copy(sunDay).lerp(sunSet,low*0.8);
  stars.material.opacity=(1-dayF)*0.9;
  waterMat.uniforms.uTime.value=t;

  for(var i2=0;i2<clouds.length;i2++){
    var cl=clouds[i2];
    cl.userData.ang+=dt*cl.userData.sp;
    cl.position.x=Math.cos(cl.userData.ang)*cl.userData.rad;
    cl.position.z=Math.sin(cl.userData.ang)*cl.userData.rad;
    cl.material.opacity=0.5*(0.5+dayF*0.6);
  }

  var camA=t*0.08+tx*0.6;
  var camR=34-ty*5;
  camera.position.set(Math.sin(camA)*camR,12+Math.sin(t*0.3)*1.4-ty*5,Math.cos(camA)*camR);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>

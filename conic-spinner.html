<!-- Concept 55 · Conic Spinner — layered conic-gradient rings spinning and morphing through masks -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conic Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{background:#030305;color:#f2f2f5;font-family:"Syne",system-ui,sans-serif;
    overflow:hidden;display:grid;place-items:center}
  .stage{position:relative;width:min(86vmin,720px);aspect-ratio:1;display:grid;place-items:center}
  .ring{position:absolute;border-radius:50%;inset:0;will-change:transform,filter}
  .r1{background:conic-gradient(from 0deg,#ff2d55,#ff9f0a,#ffd60a,#30d158,#0a84ff,#bf5af2,#ff2d55);
    animation:spin 9s linear infinite;filter:blur(2px)}
  .r2{inset:9%;background:conic-gradient(from 180deg,transparent 0 20%,#0a84ff 30%,#bf5af2 45%,transparent 62%,#30d158 78%,transparent 100%);
    animation:spin 6s linear infinite reverse;mix-blend-mode:screen;filter:blur(1px)}
  .r3{inset:18%;background:repeating-conic-gradient(from 0deg,#fff 0deg 3deg,transparent 3deg 12deg);
    animation:spin 14s linear infinite;opacity:.5;
    mask:radial-gradient(circle,transparent 42%,#000 46%,#000 68%,transparent 72%);
    -webkit-mask:radial-gradient(circle,transparent 42%,#000 46%,#000 68%,transparent 72%)}
  .r4{inset:26%;background:conic-gradient(from 90deg,#ffd60a,#ff2d55,#bf5af2,#0a84ff,#ffd60a);
    animation:spin 4.5s cubic-bezier(.6,.05,.3,.95) infinite,morph 7s ease-in-out infinite;
    filter:blur(14px);mix-blend-mode:screen;opacity:.9}
  .r5{inset:34%;background:radial-gradient(circle at 50% 50%,#fff,#0a84ff 40%,#030305 74%);
    animation:breathe 5s ease-in-out infinite;box-shadow:0 0 120px 30px rgba(10,132,255,.4)}
  .core{position:relative;z-index:4;width:22%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff,#7aa7ff 45%,#05060d 78%);
    box-shadow:0 0 60px rgba(255,255,255,.5),0 0 140px rgba(90,140,255,.45);
    animation:breathe 5s ease-in-out infinite}
  .scan{position:absolute;inset:-10%;border-radius:50%;pointer-events:none;z-index:5;
    background:conic-gradient(from 0deg,transparent 0 84%,rgba(255,255,255,.55) 92%,transparent 100%);
    animation:spin 3.2s linear infinite;mix-blend-mode:overlay;filter:blur(6px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes morph{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(140deg)}}
  @keyframes breathe{0%,100%{transform:scale(.94);opacity:.92}50%{transform:scale(1.08);opacity:1}}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:1.4rem 1.6rem;font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.34em;
    text-transform:uppercase;color:rgba(255,255,255,.55);z-index:10}
  .title{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
  .title h1{font-weight:800;font-size:clamp(1.6rem,6vw,3.4rem);letter-spacing:.18em;text-transform:uppercase}
  .badge{position:fixed;bottom:1.1rem;left:1.1rem;z-index:20;font-family:"Space Mono",monospace;
    font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
    background:rgba(10,10,14,.5);border:1px solid rgba(255,255,255,.16);border-radius:999px;
    padding:.5rem .85rem;backdrop-filter:blur(8px);color:rgba(255,255,255,.7)}
  .badge a{color:#fff;text-decoration:none}
  .badge a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="hud"><span>REV · 55</span><span>conic / mask / spin</span></div>
  <div class="stage" id="stage">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="scan"></div>
    <div class="core"></div>
  </div>
  <div class="title"><h1>Vortex</h1></div>
  <div class="badge">Conic Spinner &nbsp;·&nbsp; <a href="index.html">&larr; Gallery</a></div>
  <script>
    const stage=document.getElementById('stage');
    let s=1,ts=1;
    addEventListener('pointermove',e=>{
      ts=1+((e.clientX/innerWidth)-.5)*.18;
      stage.style.setProperty('--tiltx',((e.clientY/innerHeight)-.5)*-10+'deg');
    },{passive:true});
    (function loop(){
      s+=(ts-s)*.06;
      stage.style.transform=`scale(${s})`;
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>

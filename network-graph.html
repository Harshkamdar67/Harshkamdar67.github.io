<!-- CONCEPT: Network Graph — a drifting node-link graph with proximity edges, travelling activity pulses and drag interaction -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04100d}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
  #badge{position:fixed;left:16px;bottom:14px;z-index:10;font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.14em;color:rgba(120,240,200,.55);text-transform:uppercase;
    display:flex;gap:10px;align-items:center}
  #badge a{color:rgba(120,240,200,.55);text-decoration:none;border-bottom:1px solid rgba(120,240,200,.22)}
  #badge a:hover{color:#4dffbf}
  #badge .dot{width:4px;height:4px;border-radius:50%;background:#25ffa0;box-shadow:0 0 8px #25ffa0}
  #hud{position:fixed;top:20px;left:24px;font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.1em;color:rgba(120,240,200,.5);text-transform:uppercase;line-height:1.7}
  #hud b{color:rgba(160,255,220,.9);font-weight:400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">network / live<br>nodes <b id="nc">0</b> &middot; links <b id="lc">0</b><br>drag to disturb</div>
<div id="badge"><span class="dot"></span><span>Network Graph</span><span>&middot;</span><a href="index.html">&larr; Gallery</a></div>
<script>
(()=>{
  const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
  let W,H,DPR;
  const nodes=[];
  const pulses=[];
  const N=78;
  const LINK_DIST=150;
  let dragNode=null, dragOff={x:0,y:0};

  function resize(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    cvs.width=Math.floor(W*DPR);cvs.height=Math.floor(H*DPR);
    cvs.style.width=W+'px';cvs.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function init(){
    nodes.length=0;
    for(let i=0;i<N;i++){
      nodes.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-0.5)*0.25, vy:(Math.random()-0.5)*0.25,
        r:1.4+Math.random()*2.6,
        pulse:Math.random()*Math.PI*2,
        hub: Math.random()<0.14
      });
    }
  }

  function links(){
    const out=[];
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
        const d=Math.hypot(dx,dy);
        if(d<LINK_DIST) out.push([i,j,d]);
      }
    }
    return out;
  }

  let ls=[], lcount=0;
  function loop(){
    ctx.fillStyle='rgba(4,16,13,0.26)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';

    // move
    for(const n of nodes){
      if(n===dragNode){continue;}
      n.x+=n.vx;n.y+=n.vy;
      n.pulse+=0.04;
      if(n.x<0||n.x>W)n.vx*=-1;
      if(n.y<0||n.y>H)n.vy*=-1;
      n.x=Math.max(0,Math.min(W,n.x));n.y=Math.max(0,Math.min(H,n.y));
      n.vx+=(Math.random()-0.5)*0.012;
      n.vy+=(Math.random()-0.5)*0.012;
      n.vx=Math.max(-0.6,Math.min(0.6,n.vx));
      n.vy=Math.max(-0.6,Math.min(0.6,n.vy));
    }
    if(dragNode){ dragNode.x=Math.max(0,Math.min(W,dragNode.x)); dragNode.y=Math.max(0,Math.min(H,dragNode.y)); }

    ls=links(); lcount=ls.length;

    // edges
    for(const [i,j,d] of ls){
      const a=nodes[i],b=nodes[j];
      const al=(1-d/LINK_DIST)*0.34;
      ctx.strokeStyle=`rgba(80,230,190,${al})`;
      ctx.lineWidth=0.7;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }

    // spawn activity pulses on random edges
    if(Math.random()<0.5 && ls.length){
      const e=ls[Math.floor(Math.random()*ls.length)];
      pulses.push({a:e[0],b:e[1],t:0,sp:0.012+Math.random()*0.03});
    }
    // pulses
    for(let i=pulses.length-1;i>=0;i--){
      const p=pulses[i];p.t+=p.sp;
      if(p.t>=1){pulses.splice(i,1);continue;}
      const a=nodes[p.a],b=nodes[p.b];
      const x=a.x+(b.x-a.x)*p.t, y=a.y+(b.y-a.y)*p.t;
      const g=ctx.createRadialGradient(x,y,0,x,y,9);
      g.addColorStop(0,'rgba(180,255,230,0.95)');
      g.addColorStop(1,'rgba(80,255,190,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();
    }

    // nodes
    for(const n of nodes){
      const pl=0.6+0.4*Math.sin(n.pulse);
      const rr=n.r*(n.hub?2.1:1);
      const col=n.hub?'150,255,215':'90,235,190';
      const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*6);
      g.addColorStop(0,`rgba(${col},${0.5+pl*0.4})`);
      g.addColorStop(1,`rgba(${col},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,rr*6,0,7);ctx.fill();
      ctx.fillStyle=`rgba(210,255,238,${0.75+pl*0.25})`;
      ctx.beginPath();ctx.arc(n.x,n.y,rr,0,7);ctx.fill();
      if(n.hub){
        ctx.strokeStyle=`rgba(140,255,210,${0.3+pl*0.3})`;ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(n.x,n.y,rr*2.4+n.pulse%3,0,7);ctx.stroke();
      }
    }
    ctx.globalCompositeOperation='source-over';

    document.getElementById('nc').textContent=nodes.length;
    document.getElementById('lc').textContent=lcount;

    // vignette
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(1,8,6,0.6)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

    requestAnimationFrame(loop);
  }

  // drag
  function pick(x,y){
    let best=null,bd=26;
    for(const n of nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<bd){bd=d;best=n;}}
    return best;
  }
  cvs.addEventListener('pointerdown',e=>{
    const n=pick(e.clientX,e.clientY);
    if(n){dragNode=n;dragOff={x:n.x-e.clientX,y:n.y-e.clientY};cvs.style.cursor='grabbing';}
  });
  window.addEventListener('pointermove',e=>{
    if(dragNode){dragNode.x=e.clientX+dragOff.x;dragNode.y=e.clientY+dragOff.y;}
    else cvs.style.cursor=pick(e.clientX,e.clientY)?'grab':'default';
  });
  window.addEventListener('pointerup',()=>{dragNode=null;cvs.style.cursor='default';});

  addEventListener('resize',()=>{resize();});
  resize();init();requestAnimationFrame(loop);
})();
</script>
</body>
</html>

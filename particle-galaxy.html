<!-- Particle Galaxy - 120k-point additive spiral galaxy -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Galaxy</title>
<style>
html,body{margin:0;height:100%;background:#02020a;overflow:hidden}
#c{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:18px;bottom:16px;z-index:5;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
letter-spacing:.16em;color:rgba(200,215,255,.55);text-transform:uppercase}
.badge a{color:rgba(150,200,255,.85);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Particle Galaxy &middot; <a href="index.html">&larr; Gallery</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,3000);
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x02020a,1);
if(THREE.sRGBEncoding) renderer.outputEncoding=THREE.sRGBEncoding;

function glowTex(){
  var s=64,cv=document.createElement('canvas');cv.width=cv.height=s;
  var g=cv.getContext('2d');
  var gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.2,'rgba(255,255,255,0.85)');
  gr.addColorStop(0.5,'rgba(255,255,255,0.28)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
var gtex=glowTex();

var N=120000, ARMS=4, RADIUS=48;
var pos=new Float32Array(N*3), col=new Float32Array(N*3);
var cIn=new THREE.Color(0xfff0c8), cMid=new THREE.Color(0xff4fa3), cOut=new THREE.Color(0x2f6bff);
var tmp=new THREE.Color();
for(var i=0;i<N;i++){
  var i3=i*3;
  var t=Math.pow(Math.random(),0.55);
  var r=t*RADIUS+0.4;
  var branch=(i%ARMS)/ARMS*Math.PI*2;
  var spin=r*0.30;
  var jit=(Math.pow(Math.random(),3)*(Math.random()<0.5?1:-1))*r*0.09;
  var ang=branch+spin+jit;
  var thick=(1-t)*2.6+0.35;
  var y=(Math.random()-0.5)*thick*1.4;
  pos[i3]=Math.cos(ang)*r;
  pos[i3+1]=y;
  pos[i3+2]=Math.sin(ang)*r;
  var f=Math.min(1,r/RADIUS);
  if(f<0.5){tmp.copy(cIn).lerp(cMid,f*2);}else{tmp.copy(cMid).lerp(cOut,(f-0.5)*2);}
  var b=0.55+Math.random()*0.75;
  col[i3]=tmp.r*b;col[i3+1]=tmp.g*b;col[i3+2]=tmp.b*b;
}
var geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
var mat=new THREE.PointsMaterial({size:0.5,map:gtex,vertexColors:true,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true,opacity:0.95});
var galaxy=new THREE.Points(geo,mat);
scene.add(galaxy);

var core=new THREE.Sprite(new THREE.SpriteMaterial({map:gtex,color:0xffd9a0,transparent:true,
  blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.9}));
core.scale.set(30,30,1);scene.add(core);

var mx=0,my=0,tx=0,ty=0;
addEventListener('mousemove',function(e){mx=(e.clientX/innerWidth-0.5)*2;my=(e.clientY/innerHeight-0.5)*2;});
addEventListener('touchmove',function(e){var t=e.touches[0];if(t){mx=(t.clientX/innerWidth-0.5)*2;my=(t.clientY/innerHeight-0.5)*2;}},{passive:true});
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

var clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var t=clock.getElapsedTime();
  tx+=(mx-tx)*0.04;ty+=(my-ty)*0.04;
  galaxy.rotation.y=t*0.02;
  var a=t*0.06+tx*0.7;
  var rad=54;
  camera.position.x=Math.sin(a)*rad;
  camera.position.z=Math.cos(a)*rad;
  camera.position.y=20-ty*16;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
animate();
})();
</script>
</body>
</html>

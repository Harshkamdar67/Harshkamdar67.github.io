<!-- Concept 38: Water Ripple — a discrete wave-equation surface that splashes and ripples under clicks -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Ripple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#020814}
  canvas{display:block;width:100vw;height:100vh}
  .badge{
    position:fixed;left:14px;bottom:14px;z-index:10;
    font:600 10px/1.3 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(190,235,255,.66);background:rgba(4,16,32,.42);
    border:1px solid rgba(90,200,255,.2);padding:7px 12px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:10px;align-items:center;pointer-events:none;white-space:nowrap;
  }
  .badge a{pointer-events:auto;color:rgba(120,215,255,.92);text-decoration:none;transition:color .2s}
  .badge a:hover{color:#fff}
  .badge .sep{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge"><span>Water Ripple</span><span class="sep">/</span><a href="index.html">&larr; Gallery</a></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const CELL = 4;
  const DAMPING = 0.9965;
  let cols = 0, rows = 0, N = 0;
  let cur = null, prev = null, next = null;
  let off = null, offctx = null, img = null, data = null;

  function alloc() {
    cols = Math.max(8, Math.ceil(W / CELL) + 2);
    rows = Math.max(8, Math.ceil(H / CELL) + 2);
    N = cols * rows;
    cur = new Float32Array(N);
    prev = new Float32Array(N);
    next = new Float32Array(N);
    off = document.createElement('canvas');
    off.width = cols; off.height = rows;
    offctx = off.getContext('2d');
    img = offctx.createImageData(cols, rows);
    data = img.data;
  }

  function drop(px, py, radius, strength) {
    const cx = Math.round(px / CELL) + 1;
    const cy = Math.round(py / CELL) + 1;
    const r = Math.max(2, Math.round(radius / CELL));
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 1 || y < 1 || x >= cols - 1 || y >= rows - 1) continue;
        const d = Math.sqrt(dx * dx + dy * dy) / r;
        if (d > 1) continue;
        const bump = Math.cos(d * Math.PI * 0.5) * strength;
        const i = y * cols + x;
        cur[i] += bump;
        prev[i] += bump;
      }
    }
  }

  function simulate() {
    // proper two-buffer wave equation: read cur/prev, write next (no in-place aliasing)
    for (let y = 1; y < rows - 1; y++) {
      const row = y * cols;
      for (let x = 1; x < cols - 1; x++) {
        const i = row + x;
        const n = (cur[i - 1] + cur[i + 1] + cur[i - cols] + cur[i + cols]) * 0.5 - prev[i];
        next[i] = n * DAMPING;
      }
    }
    // reflective borders
    for (let x = 0; x < cols; x++) {
      next[x] = next[cols + x];
      next[(rows - 1) * cols + x] = next[(rows - 2) * cols + x];
    }
    for (let y = 0; y < rows; y++) {
      next[y * cols] = next[y * cols + 1];
      next[y * cols + cols - 1] = next[y * cols + cols - 2];
    }
    // rotate buffers: next -> cur, cur -> prev
    const t = prev; prev = cur; cur = next; next = t;
  }

  function render() {
    const d = data;
    let p = 0;
    for (let y = 0; y < rows; y++) {
      const row = y * cols;
      for (let x = 0; x < cols; x++) {
        const i = row + x;
        const h = cur[i];
        // surface gradient -> shading + specular
        const xm = cur[i - (x > 0 ? 1 : 0)];
        const xp = cur[i + (x < cols - 1 ? 1 : 0)];
        const ym = cur[i - (y > 0 ? cols : 0)];
        const yp = cur[i + (y < rows - 1 ? cols : 0)];
        const gx = (xm - xp) * 26;
        const gy = (ym - yp) * 26;
        const hh = h * 9;
        let shade = hh + gx * 0.6 + gy * 0.6;
        let spec = Math.max(0, gx * 0.5 + gy * 0.5);
        spec = spec * spec * 0.9;
        let R = 6 + shade * 9 + spec * 78;
        let G = 32 + shade * 24 + spec * 108;
        let B = 80 + shade * 38 + spec * 140;
        if (R < 0) R = 0; else if (R > 255) R = 255;
        if (G < 0) G = 0; else if (G > 255) G = 255;
        if (B < 0) B = 0; else if (B > 255) B = 255;
        d[p++] = R; d[p++] = G; d[p++] = B; d[p++] = 255;
      }
    }
    offctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(off, 0, 0, W, H);
  }

  // interaction
  let lastMove = 0;
  function evt(e) { const t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }
  canvas.addEventListener('mousedown', e => { const p = evt(e); drop(p.x, p.y, 34, 0.85); e.preventDefault(); });
  canvas.addEventListener('mousemove', e => {
    const p = evt(e);
    const now = performance.now();
    if (now - lastMove > 45) { drop(p.x, p.y, 14, 0.28); lastMove = now; }
  });
  canvas.addEventListener('touchstart', e => { const p = evt(e); drop(p.x, p.y, 36, 0.9); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    const p = evt(e);
    const now = performance.now();
    if (now - lastMove > 45) { drop(p.x, p.y, 16, 0.3); lastMove = now; }
    e.preventDefault();
  }, { passive: false });

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    alloc();
    drop(W * 0.5, H * 0.5, 60, 1.1);
  }

  // ambient rain
  let rainT = 0;

  const FIXED = 1 / 60;
  let acc = 0, last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 6) { simulate(); acc -= FIXED; guard++; }
    if (guard >= 6) acc = 0;

    rainT -= dt;
    if (rainT <= 0) {
      rainT = 0.6 + Math.random() * 1.4;
      drop(Math.random() * W, Math.random() * H, 20 + Math.random() * 26, 0.35 + Math.random() * 0.4);
    }
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!-- Concept 35: N-Body Gravity — a swarm of stars and dust orbiting under mutual gravity, glowing trails -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Body Gravity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a}
  canvas{display:block;width:100vw;height:100vh}
  .badge{
    position:fixed;left:14px;bottom:14px;z-index:10;
    font:600 10px/1.3 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(200,220,255,.6);background:rgba(6,10,24,.42);
    border:1px solid rgba(110,160,255,.18);padding:7px 12px;border-radius:999px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;gap:10px;align-items:center;pointer-events:none;white-space:nowrap;
  }
  .badge a{pointer-events:auto;color:rgba(120,190,255,.9);text-decoration:none;transition:color .2s}
  .badge a:hover{color:#fff}
  .badge .sep{opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge"><span>N-Body Gravity</span><span class="sep">/</span><a href="index.html">&larr; Gallery</a></div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const SOFT2 = 900;              // softening squared
  const EPS = 6;
  const DUST = 620;
  const MOUSE_G = 26000;

  let bodies = [];   // massive: {x,y,vx,vy,m,hue,r}
  let dust = [];     // massless tracers: {x,y,vx,vy,hue}
  let cx = 0, cy = 0;

  const planetHues = [28, 45, 190, 265, 330, 160, 210];

  function build() {
    cx = W * 0.5; cy = H * 0.5;
    bodies = [];
    dust = [];
    const scale = Math.min(W, H) * 0.46;

    const sun = { x: cx, y: cy, vx: 0, vy: 0, m: 260000, hue: 42, r: 13, sun: true };
    bodies.push(sun);

    const nP = 6;
    for (let i = 0; i < nP; i++) {
      const r = scale * (0.24 + 0.13 * i) * (0.92 + Math.random() * 0.16);
      const ang = Math.random() * Math.PI * 2;
      const x = cx + Math.cos(ang) * r;
      const y = cy + Math.sin(ang) * r;
      const v = Math.sqrt(sun.m / r);            // circular orbit about the sun
      const vx = -Math.sin(ang) * v;
      const vy = Math.cos(ang) * v;
      const m = 900 + Math.random() * 1800;
      bodies.push({ x, y, vx, vy, m, hue: planetHues[i % planetHues.length], r: 4 + m / 900 });
    }

    for (let i = 0; i < DUST; i++) {
      const r = scale * (0.15 + Math.pow(Math.random(), 0.7) * 0.85);
      const ang = Math.random() * Math.PI * 2;
      const x = cx + Math.cos(ang) * r;
      const y = cy + Math.sin(ang) * r;
      const v = Math.sqrt(sun.m / r) * (0.97 + Math.random() * 0.06);
      dust.push({
        x, y,
        vx: -Math.sin(ang) * v + (Math.random() - 0.5) * 8,
        vy: Math.cos(ang) * v + (Math.random() - 0.5) * 8,
        hue: 185 + Math.random() * 60
      });
    }
  }

  function accel(x, y, ignoreSun) {
    let ax = 0, ay = 0;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      const dx = b.x - x, dy = b.y - y;
      const d2 = dx * dx + dy * dy + SOFT2;
      const inv = 1 / Math.sqrt(d2);
      const f = b.m * inv * inv * inv;
      ax += dx * f; ay += dy * f;
    }
    return { ax, ay };
  }

  const mouse = { x: 0, y: 0, on: false };
  function evt(e) { const t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }
  canvas.addEventListener('mousedown', e => { const p = evt(e); mouse.x = p.x; mouse.y = p.y; mouse.on = true; e.preventDefault(); });
  canvas.addEventListener('mousemove', e => { const p = evt(e); mouse.x = p.x; mouse.y = p.y; });
  window.addEventListener('mouseup', () => mouse.on = false);
  canvas.addEventListener('touchstart', e => { const p = evt(e); mouse.x = p.x; mouse.y = p.y; mouse.on = true; e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', e => { const p = evt(e); mouse.x = p.x; mouse.y = p.y; e.preventDefault(); }, { passive: false });
  window.addEventListener('touchend', () => mouse.on = false);

  function step(dt) {
    // massive bodies: pairwise
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      let ax = 0, ay = 0;
      for (let j = 0; j < bodies.length; j++) {
        if (i === j) continue;
        const b = bodies[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy + SOFT2;
        const inv = 1 / Math.sqrt(d2);
        const f = b.m * inv * inv * inv;
        ax += dx * f; ay += dy * f;
      }
      a.vx += ax * dt; a.vy += ay * dt;
    }
    for (const b of bodies) { b.x += b.vx * dt; b.y += b.vy * dt; }

    // dust
    for (let i = 0; i < dust.length; i++) {
      const p = dust[i];
      const { ax, ay } = accel(p.x, p.y);
      p.vx += ax * dt; p.vy += ay * dt;
      if (mouse.on) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const d2 = dx * dx + dy * dy + 2500;
        const inv = 1 / Math.sqrt(d2);
        const f = MOUSE_G * inv * inv * inv;
        p.vx += dx * f * dt; p.vy += dy * f * dt;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      // recycle far escapees
      const ddx = p.x - cx, ddy = p.y - cy;
      if (ddx * ddx + ddy * ddy > (Math.max(W, H) * 0.85) ** 2) {
        const r = Math.min(W, H) * 0.2;
        const ang = Math.random() * Math.PI * 2;
        p.x = cx + Math.cos(ang) * r; p.y = cy + Math.sin(ang) * r;
        const v = Math.sqrt(bodies[0].m / r);
        p.vx = -Math.sin(ang) * v; p.vy = Math.cos(ang) * v;
      }
    }
  }

  function render() {
    // long-exposure fade
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2,3,10,0.055)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // dust trails
    for (let i = 0; i < dust.length; i++) {
      const p = dust[i];
      const spd = Math.min(Math.hypot(p.vx, p.vy) / 90, 1);
      ctx.fillStyle = 'hsla(' + p.hue + ',95%,' + (62 + spd * 25) + '%,' + (0.14 + spd * 0.5) + ')';
      const r = 0.7 + spd * 1.3;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill();
    }

    // bodies with glow
    for (const b of bodies) {
      const R = b.sun ? b.r * 4.2 : b.r * 3.4;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R);
      g.addColorStop(0, 'hsla(' + b.hue + ',100%,92%,0.95)');
      g.addColorStop(0.25, 'hsla(' + b.hue + ',100%,65%,0.55)');
      g.addColorStop(1, 'hsla(' + b.hue + ',100%,55%,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'hsla(' + b.hue + ',100%,97%,1)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (b.sun ? 1.6 : 1), 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = 'rgba(2,3,10,1)'; ctx.fillRect(0, 0, W, H);
    build();
  }

  const FIXED = 1 / 180;
  let acc = 0, last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard < 10) { step(FIXED); acc -= FIXED; guard++; }
    if (guard >= 10) acc = 0;
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

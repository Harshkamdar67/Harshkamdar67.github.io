<!-- Flow Field — a Perlin-noise flow field traced by thousands of luminous particles -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Field</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#04050a;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
.badge{position:fixed;left:14px;bottom:14px;z-index:9;font:12px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:rgba(255,255,255,.5);background:rgba(8,10,18,.35);border:1px solid rgba(255,255,255,.1);
  padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);letter-spacing:.03em}
.badge a{color:rgba(170,220,255,.9);text-decoration:none}
.badge a:hover{color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="badge">Flow Field &middot; <a href="index.html">&larr; Gallery</a></div>
<script>
(()=>{
const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();

/* ---- Perlin noise ---- */
const perm=new Uint8Array(512);
(function(){
  const p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(Math.random()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)perm[i]=p[i&255];
})();
const fade=t=>t*t*t*(t*(t*6-15)+10);
const lerp=(a,b,t)=>a+(b-a)*t;
function grad(h,x,y){switch(h&3){case 0:return x+y;case 1:return -x+y;case 2:return x-y;default:return -x-y;}}
function noise(x,y){
  const X=Math.floor(x)&255,Y=Math.floor(y)&255;
  x-=Math.floor(x);y-=Math.floor(y);
  const u=fade(x),v=fade(y);
  const A=perm[X]+Y,B=perm[X+1]+Y;
  return lerp(lerp(grad(perm[A],x,y),grad(perm[B],x-1,y),u),
              lerp(grad(perm[A+1],x,y-1),grad(perm[B+1],x-1,y-1),u),v);
}

/* ---- particles ---- */
const N=2600;
const px=new Float32Array(N),py=new Float32Array(N),pk=new Float32Array(N);
for(let i=0;i<N;i++){px[i]=Math.random()*W;py[i]=Math.random()*H;pk[i]=Math.random();}
const mouse={x:0,y:0,active:false};
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;});
addEventListener('pointerleave',()=>{mouse.active=false;});
addEventListener('pointerdown',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;
  for(let i=0;i<N;i++){if(Math.random()<0.5){px[i]=mouse.x+(Math.random()-.5)*220;py[i]=mouse.y+(Math.random()-.5)*220;}}
});

const PAL=36, pal=new Array(PAL);
let t=0;
const scale=0.0016;
function frame(){
  ctx.fillStyle='rgba(4,5,10,0.055)';
  ctx.fillRect(0,0,W,H);
  ctx.lineWidth=1.05;ctx.lineCap='round';
  t+=0.0015;
  const z=t;
  const baseHue=180+Math.sin(z*1.7)*60;
  for(let k=0;k<PAL;k++){
    pal[k]='hsla('+((baseHue+(k/PAL)*140+360)%360)+',88%,62%,0.40)';
  }
  for(let i=0;i<N;i++){
    const x=px[i],y=py[i];
    const a=noise(x*scale,y*scale+z*40)*Math.PI*3.2+z*6.0;
    let vx=Math.cos(a)*1.55,vy=Math.sin(a)*1.55;
    if(mouse.active){
      const dx=x-mouse.x,dy=y-mouse.y,d2=dx*dx+dy*dy;
      if(d2<46000&&d2>4){const f=110/d2;vx+=dx*f;vy+=dy*f;}
    }
    const nx=x+vx,ny=y+vy;
    ctx.strokeStyle=pal[(pk[i]*PAL)|0];
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();
    px[i]=nx;py[i]=ny;
    if(nx<-2||nx>W+2||ny<-2||ny>H+2||Math.random()<0.0012){
      px[i]=Math.random()*W;py[i]=Math.random()*H;
    }
  }
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
